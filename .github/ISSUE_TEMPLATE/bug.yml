name: Bug report
description: Report a reproducible Covalent defect without including private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Follow SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS on Apple Silicon, Android, Docker web console, Unraid, Rust core or daemon]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Release version, image digest, or full commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include exact steps, expected result, actual result, and sanitized logs.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data-safety impact
      description: State whether source files, destination files, or identity data may be at risk. Include timing and deletion choices, but no private paths or credentials.
    validations:
      required: true
