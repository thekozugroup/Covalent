name: Feature request
description: Propose a simpler way to pair devices, share folders, or monitor transfers.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the outcome that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the affected platform, source and recipient behavior, deletion choices, and compatibility expectations.
    validations:
      required: true
  - type: checkboxes
    id: invariants
    attributes:
      label: Product invariants
      options:
        - label: Core workflows remain local-first with no required hosted account.
          required: true
        - label: Source and destination folders remain explicitly authorized.
          required: true
        - label: File direction and deletion behavior remain clear and preserve existing data-safety rules.
          required: true
