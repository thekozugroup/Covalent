name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed version for this exact commit
        required: true
        type: string
      first_release:
        description: Explicitly confirm there is no prior signed Covalent Android release to upgrade
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: signed-android-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-verify:
    name: Build and verify unsigned Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      # prepareReleaseCandidate builds the release APK and AAB, which package the
      # pinned JNI libraries through :app:buildAndroidJni. That task shells out to
      # scripts/build-android-jni.sh, which cross-compiles the crate with
      # `cargo ndk` before linking the shared object itself against
      # crates/covalent-android-jni/exports.map. The pinned NDK, the rustup
      # toolchain with both Android targets, and cargo-ndk 4.1.2 are therefore all
      # required here exactly as they are in CI; without them the release build
      # fails at the native step with `error: no such command: 'ndk'`.
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install the pinned cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ./scripts/check-android-jni-contract.sh
      # Share CI's probe rather than keeping a second, silent copy: this one used
      # to be three bare `test` commands that printed nothing when they failed,
      # so a release run could not tell a missing /dev/kvm from a permissions
      # problem. The shared script also proves acceleration with a live
      # KVM_GET_API_VERSION ioctl instead of trusting the mode bits.
      - name: Require KVM acceleration for API 37 release verification
        run: ./scripts/require-kvm-acceleration.sh
      - name: Verify immutable version and exact-commit software gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release version must be an explicit v-prefixed semantic version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/tags/${RELEASE_VERSION}" || "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "run this workflow from refs/tags/${RELEASE_VERSION}; release publication must use the exact signed tag ref" >&2
            exit 1
          fi
          workspace_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          android_version=$(awk -F'"' '/versionName = / { print $2; exit }' apps/android/app/build.gradle.kts)
          test "${RELEASE_VERSION#v}" = "${workspace_version}"
          test "${RELEASE_VERSION#v}" = "${android_version}"
          test "$(git rev-list -n 1 "${RELEASE_VERSION}")" = "${GITHUB_SHA}"
          checks=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required in "Shared Rust and contracts" "macOS integration and UI" "macOS app bundle" "Android foundation" "Android API 37 device" "Container foundation" "Container arm64 image" "CodeQL java-kotlin" "CodeQL swift" "CodeQL policy" "Release candidate software gates"; do
            if ! jq -e --arg name "${required}" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // .created_at) | last | select(.status == "completed" and .conclusion == "success")' <<<"${checks}" >/dev/null; then
              echo "latest required exact-commit check is not green: ${required}" >&2
              exit 1
            fi
          done
          ./scripts/release-version.sh check
          RELEASE_VERSION="${RELEASE_VERSION}" ./scripts/verify-release-commit-signature.sh
      # This job deliberately has no signing secrets. It resolves dependencies,
      # compiles the JNI payload, and produces the unsigned release candidates
      # whose checksums become the handoff boundary for the signing job.
      - name: Build unsigned APK, AAB, SBOM, mapping, and checksums
        run: ./apps/android/gradlew -p apps/android --no-daemon --dependency-verification=strict generateReleaseChecksums
      - name: Verify unsigned release checksums
        run: |
          set -euo pipefail
          (cd apps/android/app/build && shasum -a 256 -c reports/covalent/SHA256SUMS)
          test -f apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f apps/android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-covalent-android-${{ inputs.version }}-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release-unsigned.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
            apps/android/app/build/reports/covalent/android-sbom.cdx.json
            apps/android/app/build/reports/covalent/android-license-inventory.json
            apps/android/app/build/reports/covalent/SHA256SUMS
          if-no-files-found: error

  sign-verify:
    name: Sign and verify Android artifacts
    needs: build-verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      # Build-tools are needed only for local zip alignment and signature
      # verification. This job never invokes Gradle or resolves a dependency.
      - run: sdkmanager "build-tools;37.0.0"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: unsigned-covalent-android-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-android-build
      - name: Verify the unsigned handoff before loading signing material
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/unsigned-android-build"
          mapfile -t checksums < <(find "${root}" -type f -path '*/reports/covalent/SHA256SUMS' -print)
          if [[ "${#checksums[@]}" -ne 1 ]]; then
            echo "expected exactly one unsigned release checksum manifest" >&2
            exit 1
          fi
          build_root="${checksums[0]%/reports/covalent/SHA256SUMS}"
          (cd "${build_root}" && shasum -a 256 -c reports/covalent/SHA256SUMS)
      - name: Install ephemeral release keystore
        env:
          COVALENT_ANDROID_KEYSTORE_BASE64: ${{ secrets.COVALENT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${COVALENT_ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "required Android release credential is unavailable: COVALENT_ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          keystore="${RUNNER_TEMP}/covalent-release.keystore"
          printf '%s' "${COVALENT_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"
          echo "COVALENT_ANDROID_KEYSTORE_PATH=${keystore}" >> "${GITHUB_ENV}"
      - name: Sign the verified APK and AAB
        env:
          COVALENT_ANDROID_STORE_PASSWORD: ${{ secrets.COVALENT_ANDROID_STORE_PASSWORD }}
          COVALENT_ANDROID_KEY_ALIAS: ${{ secrets.COVALENT_ANDROID_KEY_ALIAS }}
          COVALENT_ANDROID_KEY_PASSWORD: ${{ secrets.COVALENT_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in COVALENT_ANDROID_STORE_PASSWORD COVALENT_ANDROID_KEY_ALIAS COVALENT_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "required Android release credential is unavailable: ${variable}" >&2
              exit 1
            fi
          done
          root="${RUNNER_TEMP}/unsigned-android-build"
          mapfile -t apks < <(find "${root}" -type f -name app-release-unsigned.apk -print)
          mapfile -t aabs < <(find "${root}" -type f -path '*/outputs/bundle/release/app-release.aab' -print)
          if [[ "${#apks[@]}" -ne 1 || "${#aabs[@]}" -ne 1 ]]; then
            echo "expected exactly one unsigned APK and AAB" >&2
            exit 1
          fi
          apksigner_path=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          zipalign_path=$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)
          test -x "${apksigner_path}"
          test -x "${zipalign_path}"
          staging="${RUNNER_TEMP}/android-release-assets"
          mkdir -p "${staging}"
          aligned_apk="${RUNNER_TEMP}/covalent-release-aligned.apk"
          release_apk="${staging}/Covalent-${{ inputs.version }}-android-release.apk"
          release_aab="${staging}/Covalent-${{ inputs.version }}-android.aab"
          "${zipalign_path}" -f -p 16 "${apks[0]}" "${aligned_apk}"
          "${apksigner_path}" sign \
            --ks "${COVALENT_ANDROID_KEYSTORE_PATH}" \
            --ks-key-alias "${COVALENT_ANDROID_KEY_ALIAS}" \
            --ks-pass env:COVALENT_ANDROID_STORE_PASSWORD \
            --key-pass env:COVALENT_ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "${release_apk}" \
            "${aligned_apk}"
          jarsigner \
            -keystore "${COVALENT_ANDROID_KEYSTORE_PATH}" \
            -storepass:env COVALENT_ANDROID_STORE_PASSWORD \
            -keypass:env COVALENT_ANDROID_KEY_PASSWORD \
            -signedjar "${release_aab}" \
            "${aabs[0]}" "${COVALENT_ANDROID_KEY_ALIAS}"
          {
            echo "COVALENT_RELEASE_APK=${release_apk}"
            echo "COVALENT_RELEASE_AAB=${release_aab}"
            echo "COVALENT_APKSIGNER=${apksigner_path}"
            echo "COVALENT_ANDROID_ZIPALIGN=${zipalign_path}"
          } >> "${GITHUB_ENV}"
      - name: Verify signed packages and preserve source reports
        run: |
          set -euo pipefail
          "${COVALENT_APKSIGNER}" verify --verbose --print-certs "${COVALENT_RELEASE_APK}" | tee "${RUNNER_TEMP}/apk-signature.txt"
          grep -q 'Verified using v2 scheme.*true' "${RUNNER_TEMP}/apk-signature.txt"
          jarsigner -verify -certs "${COVALENT_RELEASE_AAB}" > "${RUNNER_TEMP}/aab-signature.txt"
          grep -q 'jar verified' "${RUNNER_TEMP}/aab-signature.txt"
          ./scripts/check-android-native-package.sh "${COVALENT_RELEASE_APK}"
          ./scripts/check-android-native-package.sh "${COVALENT_RELEASE_AAB}"
          root="${RUNNER_TEMP}/unsigned-android-build"
          mapfile -t mappings < <(find "${root}" -type f -path '*/outputs/mapping/release/mapping.txt' -print)
          mapfile -t sboms < <(find "${root}" -type f -path '*/reports/covalent/android-sbom.cdx.json' -print)
          if [[ "${#mappings[@]}" -ne 1 || "${#sboms[@]}" -ne 1 ]]; then
            echo "expected exactly one mapping file and SBOM from the unsigned handoff" >&2
            exit 1
          fi
          cp "${mappings[0]}" "${RUNNER_TEMP}/android-release-assets/Covalent-${{ inputs.version }}-android-r8-mapping.txt"
          cp "${sboms[0]}" "${RUNNER_TEMP}/android-release-assets/Covalent-${{ inputs.version }}-android-sbom.cdx.json"
      # Do not carry the private signing key into the emulator action or any
      # later publication step. The signed files have already been verified.
      - name: Remove release keystore before emulator verification
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/covalent-release.keystore"
          if [[ -f "${keystore}" ]]; then
            shred --remove --zero "${keystore}" 2>/dev/null || rm -f "${keystore}"
          fi
          if [[ -e "${keystore}" || -L "${keystore}" ]]; then
            echo "release keystore could not be deleted before emulator verification" >&2
            exit 1
          fi
          echo "COVALENT_ANDROID_KEYSTORE_PATH=" >> "${GITHUB_ENV}"
      - name: Resolve prior signed package for a real upgrade gate
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_RELEASE: ${{ inputs.first_release }}
        run: |
          set -euo pipefail
          previous_dir="${RUNNER_TEMP}/previous-android"
          mkdir -p "${previous_dir}"
          previous_apk=""
          while IFS= read -r prior_tag; do
            [[ -n "${prior_tag}" ]] || continue
            mapfile -t asset_names < <(
              gh release view "${prior_tag}" --repo "${GITHUB_REPOSITORY}" --json assets \
                --jq '.assets[].name | select(endswith("-android-release.apk"))'
            )
            if [[ "${#asset_names[@]}" -gt 1 ]]; then
              echo "release ${prior_tag} contains more than one signed Android release APK" >&2
              exit 1
            fi
            if [[ "${#asset_names[@]}" -eq 0 ]]; then
              continue
            fi
            gh release download "${prior_tag}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${asset_names[0]}" --dir "${previous_dir}"
            previous_apk="${previous_dir}/${asset_names[0]}"
            test -f "${previous_apk}"
            break
          done < <(
            gh release list --repo "${GITHUB_REPOSITORY}" --limit 100 \
              --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName'
          )

          if [[ -n "${previous_apk}" ]]; then
            current_digest=$("${COVALENT_APKSIGNER}" verify --print-certs "${COVALENT_RELEASE_APK}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
            previous_digest=$("${COVALENT_APKSIGNER}" verify --print-certs "${previous_apk}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
            test -n "${current_digest}"
            test "${previous_digest}" = "${current_digest}"
            echo "COVALENT_PREVIOUS_APK=${previous_apk}" >> "${GITHUB_ENV}"
          elif [[ "${FIRST_RELEASE}" != "true" ]]; then
            echo "no prior signed Android release exists; rerun only with explicit first_release confirmation" >&2
            exit 1
          fi
      - name: Install and upgrade signed package on API 37
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          avd-name: Covalent_API_37
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8G
          emulator-port: 5570
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          pre-emulator-launch-script: |
            "$ANDROID_HOME/platform-tools/adb" start-server
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -accel on
          script: |
            set -euo pipefail
            export ANDROID_SERIAL=emulator-5570
            initial_apk="${COVALENT_PREVIOUS_APK:-${COVALENT_RELEASE_APK}}"
            if [[ "${initial_apk}" == "${COVALENT_RELEASE_APK}" ]]; then
              echo "NOTE: no prior signed release exists, so this upgrade gate is"
              echo "installing the release APK over itself. firstInstallTime is"
              echo "trivially preserved and this run proves nothing about upgrades."
            else
              echo "Upgrade gate: ${initial_apk} -> ${COVALENT_RELEASE_APK}"
            fi
            adb install "${initial_apk}"
            adb shell am start -W -n life.michaelwong.covalent/.MainActivity
            first_install=$(adb shell dumpsys package life.michaelwong.covalent | sed -n 's/.*firstInstallTime=//p' | head -n 1 | tr -d '\r')
            test -n "${first_install}"
            adb install -r "${COVALENT_RELEASE_APK}"
            adb shell am start -W -n life.michaelwong.covalent/.MainActivity
            after_install=$(adb shell dumpsys package life.michaelwong.covalent | sed -n 's/.*firstInstallTime=//p' | head -n 1 | tr -d '\r')
            test "${after_install}" = "${first_install}"
            adb shell pm path life.michaelwong.covalent
      - name: Package verified Android release handoff
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/android-release-assets"
          cd "${staging}"
          for artifact in \
            "Covalent-${RELEASE_VERSION}-android-release.apk" \
            "Covalent-${RELEASE_VERSION}-android.aab" \
            "Covalent-${RELEASE_VERSION}-android-r8-mapping.txt" \
            "Covalent-${RELEASE_VERSION}-android-sbom.cdx.json"; do
            test -f "${artifact}"
          done
          shasum -a 256 \
            "Covalent-${RELEASE_VERSION}-android-release.apk" \
            "Covalent-${RELEASE_VERSION}-android.aab" \
            "Covalent-${RELEASE_VERSION}-android-r8-mapping.txt" \
            "Covalent-${RELEASE_VERSION}-android-sbom.cdx.json" \
            > "Covalent-${RELEASE_VERSION}-android-SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-signed-covalent-android-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/android-release-assets
          if-no-files-found: error
          retention-days: 7
      - name: Remove ephemeral release keystore
        if: always()
        run: |
          set +e
          keystore="${RUNNER_TEMP}/covalent-release.keystore"
          [[ -f "${keystore}" ]] || exit 0
          shred --remove --zero "${keystore}" 2>/dev/null || rm -f "${keystore}"

  publish:
    name: Re-verify and publish signed Android artifacts
    needs: sign-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-signed-covalent-android-${{ inputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/android-release-assets
      - name: Verify signed Android handoff before publication
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/android-release-assets"
          cd "${staging}"
          manifest="Covalent-${RELEASE_VERSION}-android-SHA256SUMS.txt"
          test -f "${manifest}"
          shasum -a 256 -c "${manifest}"
          for artifact in \
            "Covalent-${RELEASE_VERSION}-android-release.apk" \
            "Covalent-${RELEASE_VERSION}-android.aab" \
            "Covalent-${RELEASE_VERSION}-android-r8-mapping.txt" \
            "Covalent-${RELEASE_VERSION}-android-sbom.cdx.json"; do
            test -f "${artifact}"
          done
      - name: Publish signed Android build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/android-release-assets"
          ./scripts/publish-release-assets.sh "${RELEASE_VERSION}" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-release.apk" \
            "${staging}/Covalent-${RELEASE_VERSION}-android.aab" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-r8-mapping.txt" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-sbom.cdx.json" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-SHA256SUMS.txt"
