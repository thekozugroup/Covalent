name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed version for this exact commit
        required: true
        type: string
      first_release:
        description: Explicitly confirm there is no prior signed Covalent Android release to upgrade
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  checks: read
  security-events: read

concurrency:
  group: signed-android-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-verify:
    name: Sign and verify Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COVALENT_ANDROID_KEYSTORE_BASE64: ${{ secrets.COVALENT_ANDROID_KEYSTORE_BASE64 }}
      COVALENT_ANDROID_STORE_PASSWORD: ${{ secrets.COVALENT_ANDROID_STORE_PASSWORD }}
      COVALENT_ANDROID_KEY_ALIAS: ${{ secrets.COVALENT_ANDROID_KEY_ALIAS }}
      COVALENT_ANDROID_KEY_PASSWORD: ${{ secrets.COVALENT_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      # prepareReleaseCandidate builds the release APK and AAB, which package the
      # pinned JNI libraries through :app:buildAndroidJni. That task shells out to
      # scripts/build-android-jni.sh, which cross-compiles the crate with
      # `cargo ndk` before linking the shared object itself against
      # crates/covalent-android-jni/exports.map. The pinned NDK, the rustup
      # toolchain with both Android targets, and cargo-ndk 4.1.2 are therefore all
      # required here exactly as they are in CI; without them the release build
      # fails at the native step with `error: no such command: 'ndk'`.
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install the pinned cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: ./scripts/check-android-jni-contract.sh
      # Share CI's probe rather than keeping a second, silent copy: this one used
      # to be three bare `test` commands that printed nothing when they failed,
      # so a release run could not tell a missing /dev/kvm from a permissions
      # problem. The shared script also proves acceleration with a live
      # KVM_GET_API_VERSION ioctl instead of trusting the mode bits.
      - name: Require KVM acceleration for API 37 release verification
        run: ./scripts/require-kvm-acceleration.sh
      - name: Verify immutable version and exact-commit software gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release version must be an explicit v-prefixed semantic version" >&2
            exit 1
          fi
          workspace_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          android_version=$(awk -F'"' '/versionName = / { print $2; exit }' apps/android/app/build.gradle.kts)
          test "${RELEASE_VERSION#v}" = "${workspace_version}"
          test "${RELEASE_VERSION#v}" = "${android_version}"
          test "$(git rev-list -n 1 "${RELEASE_VERSION}")" = "${GITHUB_SHA}"
          checks=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required in "Shared Rust and contracts" "macOS integration and UI" "macOS app bundle" "Android foundation" "Android API 37 device" "Container foundation" "Container arm64 image" "CodeQL java-kotlin" "CodeQL swift" "CodeQL policy" "Release candidate software gates"; do
            if ! jq -e --arg name "${required}" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // .created_at) | last | select(.status == "completed" and .conclusion == "success")' <<<"${checks}" >/dev/null; then
              echo "latest required exact-commit check is not green: ${required}" >&2
              exit 1
            fi
          done
          ./scripts/release-version.sh check
          ./scripts/verify-release-commit-signature.sh
      - name: Install ephemeral release keystore
        run: |
          set -euo pipefail
          for variable in \
            COVALENT_ANDROID_KEYSTORE_BASE64 \
            COVALENT_ANDROID_STORE_PASSWORD \
            COVALENT_ANDROID_KEY_ALIAS \
            COVALENT_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "required Android release credential is unavailable: ${variable}" >&2
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/covalent-release.keystore"
          printf '%s' "${COVALENT_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"
          echo "COVALENT_ANDROID_KEYSTORE_PATH=${keystore}" >> "${GITHUB_ENV}"
      - name: Build signed APK, AAB, SBOM, mapping, and checksums
        run: ./apps/android/gradlew -p apps/android --no-daemon prepareReleaseCandidate
      - name: Verify release signatures and checksums
        run: |
          set -euo pipefail
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          aab="apps/android/app/build/outputs/bundle/release/app-release.aab"
          apksigner_path=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -f "${apk}"
          test -f "${aab}"
          test -x "${apksigner_path}"
          "${apksigner_path}" verify --verbose --print-certs "${apk}" | tee "${RUNNER_TEMP}/apk-signature.txt"
          grep -q 'Verified using v2 scheme.*true' "${RUNNER_TEMP}/apk-signature.txt"
          jarsigner -verify -certs "${aab}" > "${RUNNER_TEMP}/aab-signature.txt"
          grep -q 'jar verified' "${RUNNER_TEMP}/aab-signature.txt"
          (cd apps/android/app/build && shasum -a 256 -c reports/covalent/SHA256SUMS)
          echo "COVALENT_RELEASE_APK=${apk}" >> "${GITHUB_ENV}"
          echo "COVALENT_APKSIGNER=${apksigner_path}" >> "${GITHUB_ENV}"
      # scripts/check-android-native-package.sh had no caller anywhere in the
      # repository: its only mention was a `test -x` in check-android-jni-contract.sh,
      # which asserts the file's permission bit and never runs it. So the
      # `zipalign -c -P 16` alignment check, the whole-package budget, the
      # per-ABI presence of libcovalent_android_jni.so and the per-ABI size
      # budget have never run against any APK or AAB that shipped. Run them here,
      # on the signed artefacts, where they were always meant to run.
      # The size numbers themselves, and how they were derived by measurement,
      # live in scripts/android-native-budgets.sh.
      - name: Verify the signed native packages
        run: |
          set -euo pipefail
          zipalign_path=$(find "${ANDROID_HOME}/build-tools" -type f -name zipalign -print | sort -V | tail -n 1)
          test -x "${zipalign_path}"
          export COVALENT_ANDROID_ZIPALIGN="${zipalign_path}"
          ./scripts/check-android-native-package.sh "apps/android/app/build/outputs/apk/release/app-release.apk"
          ./scripts/check-android-native-package.sh "apps/android/app/build/outputs/bundle/release/app-release.aab"
      - name: Resolve prior signed package for a real upgrade gate
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST_RELEASE: ${{ inputs.first_release }}
        run: |
          set -euo pipefail
          previous_dir="${RUNNER_TEMP}/previous-android"
          mkdir -p "${previous_dir}"
          if gh release view --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release download --repo "${GITHUB_REPOSITORY}" --pattern '*release.apk' --dir "${previous_dir}"
            mapfile -t candidates < <(find "${previous_dir}" -maxdepth 1 -type f -name '*release.apk' -print)
            if [[ "${#candidates[@]}" -ne 1 ]]; then
              echo "expected exactly one prior signed release APK" >&2
              exit 1
            fi
            previous_apk="${candidates[0]}"
            current_digest=$("${COVALENT_APKSIGNER}" verify --print-certs "${COVALENT_RELEASE_APK}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
            previous_digest=$("${COVALENT_APKSIGNER}" verify --print-certs "${previous_apk}" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
            test -n "${current_digest}"
            test "${previous_digest}" = "${current_digest}"
            echo "COVALENT_PREVIOUS_APK=${previous_apk}" >> "${GITHUB_ENV}"
          elif [[ "${FIRST_RELEASE}" != "true" ]]; then
            echo "no prior signed Android release exists; rerun only with explicit first_release confirmation" >&2
            exit 1
          fi
      # The hardware envelope here has to match ci.yml's. Without `profile`,
      # `cores`, `ram-size`, `heap-size` and `disk-size` the action falls back to
      # a bare `avdmanager create avd`, which produces a 320x640 device with a
      # 64 MB Dalvik heap - an envelope ci.yml's own comment records as too small
      # for an API 37 google_apis x86_64 guest to reach userspace. This lane
      # omitted all of them, so by that same reasoning its emulator could never
      # boot and this upgrade gate has very likely never completed. Mirror CI.
      - name: Install and upgrade signed package on API 37
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          avd-name: Covalent_API_37
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8G
          emulator-port: 5570
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          pre-emulator-launch-script: |
            "$ANDROID_HOME/platform-tools/adb" start-server
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -accel on
          script: |
            set -euo pipefail
            export ANDROID_SERIAL=emulator-5570
            initial_apk="${COVALENT_PREVIOUS_APK:-${COVALENT_RELEASE_APK}}"
            if [[ "${initial_apk}" == "${COVALENT_RELEASE_APK}" ]]; then
              echo "NOTE: no prior signed release exists, so this upgrade gate is"
              echo "installing the release APK over itself. firstInstallTime is"
              echo "trivially preserved and this run proves nothing about upgrades."
            else
              echo "Upgrade gate: ${initial_apk} -> ${COVALENT_RELEASE_APK}"
            fi
            adb install "${initial_apk}"
            adb shell am start -W -n life.michaelwong.covalent/.MainActivity
            first_install=$(adb shell dumpsys package life.michaelwong.covalent | sed -n 's/.*firstInstallTime=//p' | head -n 1 | tr -d '\r')
            test -n "${first_install}"
            adb install -r "${COVALENT_RELEASE_APK}"
            adb shell am start -W -n life.michaelwong.covalent/.MainActivity
            after_install=$(adb shell dumpsys package life.michaelwong.covalent | sed -n 's/.*firstInstallTime=//p' | head -n 1 | tr -d '\r')
            test "${after_install}" = "${first_install}"
            adb shell pm path life.michaelwong.covalent
      - name: Publish the signed Android build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          staging="${RUNNER_TEMP}/android-release-assets"
          mkdir -p "${staging}"
          outputs="apps/android/app/build/outputs"
          reports="apps/android/app/build/reports/covalent"
          # The upgrade gate for the next release resolves the prior package with
          # `--pattern '*release.apk'`, so the published APK must keep that suffix.
          cp "${outputs}/apk/release/app-release.apk" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-release.apk"
          cp "${outputs}/bundle/release/app-release.aab" \
            "${staging}/Covalent-${RELEASE_VERSION}-android.aab"
          cp "${outputs}/mapping/release/mapping.txt" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-r8-mapping.txt"
          cp "${reports}/android-sbom.cdx.json" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-sbom.cdx.json"
          (cd "${staging}" && shasum -a 256 ./* > "Covalent-${RELEASE_VERSION}-android-SHA256SUMS.txt")
          ./scripts/publish-release-assets.sh "${RELEASE_VERSION}" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-release.apk" \
            "${staging}/Covalent-${RELEASE_VERSION}-android.aab" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-r8-mapping.txt" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-sbom.cdx.json" \
            "${staging}/Covalent-${RELEASE_VERSION}-android-SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-covalent-android-${{ inputs.version }}-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/mapping/release/*
            apps/android/app/build/reports/covalent/android-sbom.cdx.json
            apps/android/app/build/reports/covalent/android-license-inventory.json
            apps/android/app/build/reports/covalent/SHA256SUMS
          if-no-files-found: error
