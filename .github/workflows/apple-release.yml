name: Notarized macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed version for this exact commit
        required: true
        type: string

permissions:
  contents: write
  checks: read
  security-events: read

concurrency:
  group: notarized-macos-${{ github.sha }}
  cancel-in-progress: false

jobs:
  notarize:
    name: Developer ID sign, notarize, and staple
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Verify immutable version and exact-commit software gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release version must be an explicit v-prefixed semantic version" >&2
            exit 1
          fi
          workspace_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test "${RELEASE_VERSION#v}" = "${workspace_version}"
          test "$(git rev-list -n 1 "${RELEASE_VERSION}")" = "${GITHUB_SHA}"
          checks=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required in "Shared Rust and contracts" "macOS integration and UI" "macOS app bundle" "Android foundation" "Android API 37 device" "Container foundation" "Container arm64 image" "CodeQL java-kotlin" "CodeQL swift" "CodeQL policy" "Release candidate software gates"; do
            if ! jq -e --arg name "${required}" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // .created_at) | last | select(.status == "completed" and .conclusion == "success")' <<<"${checks}" >/dev/null; then
              echo "latest required exact-commit check is not green: ${required}" >&2
              exit 1
            fi
          done
          ./scripts/release-version.sh check
          ./scripts/verify-release-commit-signature.sh
      - name: Require signing and notarization credentials
        run: |
          set -euo pipefail
          for variable in \
            APPLE_TEAM_ID \
            DEVELOPER_ID_P12_BASE64 \
            DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!variable:-}" ]]; then
              echo "required release credential is unavailable: ${variable}" >&2
              exit 1
            fi
          done
      - run: brew install xcodegen
      - name: Install ephemeral Developer ID identity
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/covalent-signing.keychain-db"
          certificate="${RUNNER_TEMP}/developer-id.p12"
          printf '%s' "${DEVELOPER_ID_P12_BASE64}" | base64 --decode > "${certificate}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${keychain}"
          security import "${certificate}" -k "${keychain}" -P "${DEVELOPER_ID_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${keychain}"
          security list-keychains -d user -s "${keychain}"
          identity=$(security find-identity -v -p codesigning "${keychain}" | awk '/Developer ID Application/ { print $2; exit }')
          test -n "${identity}"
          echo "COVALENT_SIGNING_KEYCHAIN=${keychain}" >> "${GITHUB_ENV}"
          echo "COVALENT_SIGNING_IDENTITY=${identity}" >> "${GITHUB_ENV}"
      - name: Build hardened Apple Silicon archive
        run: |
          set -euo pipefail
          cd apps/apple
          xcodegen generate --quiet
          archive_path="${RUNNER_TEMP}/CovalentMac.xcarchive"
          xcodebuild \
            -project Covalent.xcodeproj \
            -scheme CovalentMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "${archive_path}" \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${COVALENT_SIGNING_IDENTITY}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${COVALENT_SIGNING_KEYCHAIN} --timestamp" \
            archive
          app="${archive_path}/Products/Applications/Covalent.app"
          COVALENT_REQUIRE_HARDENED_RUNTIME=true \
            COVALENT_REQUIRE_DEVELOPER_ID=true \
            "${GITHUB_WORKSPACE}/scripts/verify-apple-silicon-bundle.sh" "${app}"
          echo "COVALENT_ARCHIVE_APP=${app}" >> "${GITHUB_ENV}"
      - name: Notarize, staple, and assess
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          notary_key="${RUNNER_TEMP}/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "${APPLE_NOTARY_KEY_BASE64}" | base64 --decode > "${notary_key}"
          chmod 600 "${notary_key}"
          submission="${RUNNER_TEMP}/Covalent-notarization.zip"
          ditto -c -k --sequesterRsrc --keepParent "${COVALENT_ARCHIVE_APP}" "${submission}"
          xcrun notarytool submit "${submission}" \
            --key "${notary_key}" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}" \
            --wait \
            --timeout 30m
          xcrun stapler staple "${COVALENT_ARCHIVE_APP}"
          xcrun stapler validate "${COVALENT_ARCHIVE_APP}"
          spctl --assess --type execute --verbose=4 "${COVALENT_ARCHIVE_APP}"
          output="${RUNNER_TEMP}/Covalent-${RELEASE_VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "${COVALENT_ARCHIVE_APP}" "${output}"
          shasum -a 256 "${output}" > "${output}.sha256"
          SOURCE_DATE_EPOCH=0 ./scripts/apple-dependency-inventory.sh "${RUNNER_TEMP}/covalent-apple-inventory"
          cp Cargo.lock "${RUNNER_TEMP}/covalent-apple-inventory/Cargo.lock"
          (cd "${RUNNER_TEMP}/covalent-apple-inventory" && shasum -a 256 Cargo.lock >> SHA256SUMS)
          echo "COVALENT_RELEASE_ARTIFACT=${output}" >> "${GITHUB_ENV}"
      - name: Publish the notarized macOS build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          inventory="${RUNNER_TEMP}/Covalent-${RELEASE_VERSION}-macOS-dependency-inventory.tar.gz"
          tar -czf "${inventory}" -C "${RUNNER_TEMP}" covalent-apple-inventory
          ./scripts/publish-release-assets.sh "${RELEASE_VERSION}" \
            "${COVALENT_RELEASE_ARTIFACT}" \
            "${COVALENT_RELEASE_ARTIFACT}.sha256" \
            "${inventory}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notarized-covalent-macos-${{ inputs.version }}-${{ github.sha }}
          path: |
            ${{ env.COVALENT_RELEASE_ARTIFACT }}
            ${{ env.COVALENT_RELEASE_ARTIFACT }}.sha256
            ${{ runner.temp }}/covalent-apple-inventory
          if-no-files-found: error
      - name: Remove ephemeral signing material
        if: always()
        run: |
          if [[ -n "${COVALENT_SIGNING_KEYCHAIN:-}" ]] && [[ -f "${COVALENT_SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "${COVALENT_SIGNING_KEYCHAIN}" || true
          fi
