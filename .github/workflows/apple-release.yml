            "${handoff}/Covalent-${RELEASE_VERSION}-macOS.zip" \
            "${handoff}/Covalent-${RELEASE_VERSION}-macOS.zip.sha256" \
            "${handoff}/Covalent-${RELEASE_VERSION}-macOS-dependency-inventory.tar.gz"
