name: Unsigned macOS release

# Deliberate, separately-labelled distribution lane for the period before an
# Apple Developer Program membership exists. It produces a real, runnable
# ad-hoc-signed Apple Silicon app that Gatekeeper will quarantine, and it never
# claims to be notarized. `apple-release.yml` remains the only lane that emits a
# Developer ID signed, notarized, stapled build, and this workflow never touches
# that path or relaxes any of its checks.
#
# Every source gate that guards the notarized lane also guards this one: exact
# version agreement, tag-to-commit identity, the nine exact-commit software
# checks, and the verified release commit signature.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed version for this exact commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: unsigned-macos-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-verify:
    name: Build and verify an ad-hoc signed Apple Silicon app
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: read
      checks: read
      security-events: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - id: release
        name: Verify immutable version and exact-commit software gates
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release version must be an explicit v-prefixed semantic version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/tags/${version}" || "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "run this workflow from refs/tags/${version}; release publication must use the exact signed tag ref" >&2
            exit 1
          fi
          workspace_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          test "${version#v}" = "${workspace_version}"
          test "$(git rev-list -n 1 "${version}")" = "${GITHUB_SHA}"
          checks=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required in "Shared Rust and contracts" "macOS integration and UI" "macOS app bundle" "Android foundation" "Android API 37 device" "Container foundation" "Container arm64 image" "CodeQL java-kotlin" "CodeQL swift" "CodeQL policy" "Release candidate software gates"; do
            if ! jq -e --arg name "${required}" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // .created_at) | last | select(.status == "completed" and .conclusion == "success")' <<<"${checks}" >/dev/null; then
              echo "latest required exact-commit check is not green: ${required}" >&2
              exit 1
            fi
          done
          ./scripts/release-version.sh check
          RELEASE_VERSION="${version}" ./scripts/verify-release-commit-signature.sh
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Install checksum-pinned XcodeGen
        run: ./scripts/install-xcodegen.sh "${RUNNER_TEMP}/covalent-xcodegen" >> "${GITHUB_PATH}"
      - name: Generate and resolve locked Swift packages
        run: |
          set -euo pipefail
          test -s apps/apple/Package.resolved
          cd apps/apple
          xcodegen generate --quiet
          xcodebuild \
            -resolvePackageDependencies \
            -project Covalent.xcodeproj \
            -scheme CovalentMac \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/covalent-swiftpm" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -packageFingerprintPolicy strict \
            -packageSigningEntityPolicy strict
      - name: Refuse to reuse Developer ID material in the unsigned lane
        run: |
          set -euo pipefail
          # This lane must never silently produce something that looks notarized.
          if security find-identity -v -p codesigning | grep -q 'Developer ID Application'; then
            echo "a Developer ID identity is present; use apple-release.yml instead" >&2
            exit 1
          fi
      - name: Build the ad-hoc signed Apple Silicon archive
        run: |
          set -euo pipefail
          cd apps/apple
          archive_path="${RUNNER_TEMP}/CovalentMac.xcarchive"
          xcodebuild \
            -project Covalent.xcodeproj \
            -scheme CovalentMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "${archive_path}" \
            -clonedSourcePackagesDirPath "${RUNNER_TEMP}/covalent-swiftpm" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -packageFingerprintPolicy strict \
            -packageSigningEntityPolicy strict \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            OTHER_CODE_SIGN_FLAGS="" \
            archive
          app="${archive_path}/Products/Applications/Covalent.app"
          # Hardened runtime is a notarization requirement, and this lane does not
          # notarize. apps/apple/Scripts/build-node-helper.sh deliberately omits
          # `--options runtime` when the identity is ad-hoc, so requiring it here
          # would fail on the bundled helper by construction. Every other check in
          # the verifier still runs: arm64-only, valid signatures on both binaries,
          # and the exact sandbox-inheritance entitlements.
          COVALENT_REQUIRE_HARDENED_RUNTIME=false \
            COVALENT_REQUIRE_DEVELOPER_ID=false \
            "${GITHUB_WORKSPACE}/scripts/verify-apple-silicon-bundle.sh" "${app}"
          echo "COVALENT_ARCHIVE_APP=${app}" >> "${GITHUB_ENV}"
      - name: Assert the build is ad-hoc signed and not notarized
        run: |
          set -euo pipefail
          # Fail loudly rather than shipping something mislabelled.
          codesign -d --verbose=4 "${COVALENT_ARCHIVE_APP}" 2>&1 | tee "${RUNNER_TEMP}/adhoc-signature.txt"
          grep -q 'Signature=adhoc' "${RUNNER_TEMP}/adhoc-signature.txt"
          if xcrun stapler validate "${COVALENT_ARCHIVE_APP}" >/dev/null 2>&1; then
            echo "unexpected notarization ticket on the unsigned lane" >&2
            exit 1
          fi
      - name: Package and checksum verified unsigned app
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          handoff="${RUNNER_TEMP}/unsigned-release-handoff"
          output="${RUNNER_TEMP}/Covalent-${RELEASE_VERSION}-macOS-arm64-unsigned.zip"
          output_checksum="${output}.sha256"
          inventory="${handoff}/Covalent-${RELEASE_VERSION}-macOS-dependency-inventory.tar.gz"
          manifest="${handoff}/Covalent-${RELEASE_VERSION}-macOS-arm64-unsigned-SHA256SUMS.txt"
          ditto -c -k --sequesterRsrc --keepParent "${COVALENT_ARCHIVE_APP}" "${output}"
          (cd "$(dirname "${output}")" && shasum -a 256 "$(basename "${output}")") > "${output_checksum}"
          SOURCE_DATE_EPOCH=0 ./scripts/apple-dependency-inventory.sh "${RUNNER_TEMP}/covalent-apple-inventory"
          cp Cargo.lock "${RUNNER_TEMP}/covalent-apple-inventory/Cargo.lock"
          (cd "${RUNNER_TEMP}/covalent-apple-inventory" && shasum -a 256 Cargo.lock >> SHA256SUMS)
          mkdir -p "${handoff}"
          cp "${output}" "${output_checksum}" "${handoff}/"
          tar -czf "${inventory}" -C "${RUNNER_TEMP}" covalent-apple-inventory
          (
            cd "${handoff}"
            shasum -a 256 \
              "$(basename "${output}")" \
              "$(basename "${output_checksum}")" \
              "$(basename "${inventory}")" > "$(basename "${manifest}")"
            shasum -a 256 -c "$(basename "${output_checksum}")"
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-unsigned-covalent-macos-${{ steps.release.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-release-handoff
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Re-verify and publish unsigned macOS artifacts
    needs: build-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: verified-unsigned-covalent-macos-${{ needs.build-verify.outputs.version }}-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-release-handoff
      - name: Verify unsigned handoff before publication
        env:
          RELEASE_VERSION: ${{ needs.build-verify.outputs.version }}
        run: |
          set -euo pipefail
          handoff="${RUNNER_TEMP}/unsigned-release-handoff"
          artifact="Covalent-${RELEASE_VERSION}-macOS-arm64-unsigned.zip"
          artifact_checksum="${artifact}.sha256"
          inventory="Covalent-${RELEASE_VERSION}-macOS-dependency-inventory.tar.gz"
          manifest="Covalent-${RELEASE_VERSION}-macOS-arm64-unsigned-SHA256SUMS.txt"
          cd "${handoff}"
          test -f "${artifact}"
          test -f "${artifact_checksum}"
          test -f "${inventory}"
          test -f "${manifest}"
          shasum -a 256 -c "${manifest}"
          shasum -a 256 -c "${artifact_checksum}"
          tar -tzf "${inventory}" | grep -q '^covalent-apple-inventory/SHA256SUMS$'
      - name: Publish the unsigned macOS build to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-verify.outputs.version }}
        run: |
          set -euo pipefail
          handoff="${RUNNER_TEMP}/unsigned-release-handoff"
          ./scripts/publish-release-assets.sh "${RELEASE_VERSION}" \
            "${handoff}/Covalent-${RELEASE_VERSION}-macOS-arm64-unsigned.zip" \
            "${handoff}/Covalent-${RELEASE_VERSION}-macOS-arm64-unsigned.zip.sha256" \
            "${handoff}/Covalent-${RELEASE_VERSION}-macOS-dependency-inventory.tar.gz"
