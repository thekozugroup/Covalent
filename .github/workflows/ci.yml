name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency vulnerability and license delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: AGPL-3.0-only, GPL-3.0-only

  rust-and-contracts:
    name: Shared Rust and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # validate-foundation.sh now requires ripgrep and jq instead of skipping
      # its scans when they are absent, so guarantee both are installed rather
      # than depending on whatever the hosted runner image happens to ship.
      - name: Install validate-foundation.sh gate dependencies
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep jq
          fi
          rg --version
          jq --version
      - run: ./scripts/validate-foundation.sh
      # Every release workflow re-lists the checks it demands be green. Those
      # lists read as exhaustive and were not - "iOS Tier 2" was in none of them.
      # Derive the list from this file so a new lane cannot be added without a
      # release workflow being taught to require it.
      - run: ./scripts/check-required-checks.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: ./scripts/smoke.sh
      - run: node --test packaging/web/tests/*.test.mjs
      - run: node scripts/check-openapi-routes.mjs
      - run: npx --yes @redocly/cli@2.46.1 lint docs/api/openapi.yaml
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources
      - run: cargo build --locked --release -p covalent-node -p covalent-cli
      - run: ./scripts/check-artifact-budgets.sh
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: covalent-source.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sbom-${{ github.sha }}
          path: covalent-source.spdx.json
          if-no-files-found: error

  macos-integration-ui:
    name: macOS integration and UI
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: brew install xcodegen
      - run: swift test --package-path apps/apple
      - name: Generate Apple dependency inventories
        env:
          SOURCE_DATE_EPOCH: "0"
        run: ./scripts/apple-dependency-inventory.sh "${RUNNER_TEMP}/covalent-apple-inventory"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-dependency-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-apple-inventory
          if-no-files-found: error
      - run: apps/apple/Scripts/integration-test.sh
      - name: Run bounded macOS UI and accessibility gates
        env:
          COVALENT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/covalent-macos-ui
        run: apps/apple/Scripts/macos-ui-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-ui-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-macos-ui
          if-no-files-found: warn

  # These steps used to sit at the end of `macos-integration-ui`, behind
  # integration-test.sh and the UI gate. Over 27 consecutive runs on main they
  # never once executed: an upstream failure skipped them every time, and a
  # skipped step is reported as nothing at all rather than as a red gate. This
  # is the ONLY place in the repository that runs verify-apple-silicon-bundle.sh
  # with COVALENT_REQUIRE_HARDENED_RUNTIME=true - arm64-only binaries, valid
  # signatures, hardened runtime and the exact app-sandbox+inherit entitlements
  # on the bundled helper - so shadowing it meant none of that was ever checked.
  # It is its own job so a UI regression can no longer hide a packaging one.
  macos-app-bundle:
    name: macOS app bundle
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: brew install xcodegen
      - run: cd apps/apple && xcodegen generate --quiet
      - run: xcodebuild -project apps/apple/Covalent.xcodeproj -scheme CovalentMac -configuration Debug -destination 'platform=macOS,arch=arm64' ARCHS=arm64 EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO build
      - name: Archive and verify the Apple Silicon app-owned node
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/CovalentMac.xcarchive"
          xcodebuild -project apps/apple/Covalent.xcodeproj -scheme CovalentMac -configuration Release -destination 'generic/platform=macOS' -archivePath "$archive_path" ARCHS=arm64 EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO archive
          app="$archive_path/Products/Applications/Covalent.app"
          helper="$app/Contents/MacOS/covalent-node"
          codesign --force --options runtime --sign - --entitlements apps/apple/Config/CovalentNode.entitlements --timestamp=none "$helper"
          codesign --force --options runtime --sign - --entitlements apps/apple/Config/CovalentMac.entitlements --timestamp=none "$app"
          COVALENT_REQUIRE_HARDENED_RUNTIME=true ./scripts/verify-apple-silicon-bundle.sh "$app"
          echo "Hardened-runtime bundle gate executed and passed on $(uname -m)."

  android-foundation:
    name: Android foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      # check-android.sh runs assembleRelease, which builds the pinned JNI
      # libraries through the NDK. Install the exact pinned NDK so the gate can
      # actually run instead of failing on a missing toolchain.
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      # Building the JNI libraries is a Rust cross-compile, not just an NDK
      # invocation. scripts/build-android-jni.sh drives `cargo ndk` to produce
      # the per-ABI staticlib before it performs the final link itself, so the
      # rustup-managed toolchain, both Android targets and cargo-ndk 4.1.2 all
      # have to exist on the runner. Without them the job died at
      # `:app:buildAndroidJni` with `error: no such command: 'ndk'`; the
      # staticlib restructure moved the *link* out of rustc's hands but left the
      # compile step on cargo-ndk. Versions are pinned to what the script
      # asserts so a drift fails here with a clear message.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install the pinned cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      # The "JNI_OnLoad only" export contract is enforced from two sides: this
      # source-level gate asserts the staticlib + exports.map arrangement that
      # makes the contract expressible, and the per-ABI .dynsym audit inside
      # scripts/build-android-jni.sh (run below through assembleRelease) proves
      # the linked arm64-v8a and x86_64 objects actually honour it. The script
      # existed with no caller anywhere in the repo, so it gated nothing.
      - run: ./scripts/check-android-jni-contract.sh
      - run: ./scripts/check-android.sh
      - run: ./apps/android/gradlew -p apps/android :app:generateAndroidSbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-dependency-inventory-${{ github.sha }}
          path: |
            apps/android/app/build/reports/covalent/android-sbom.cdx.json
            apps/android/app/build/reports/covalent/android-license-inventory.json
          if-no-files-found: error

  android-device:
    name: Android API 37 device
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      # This gate runs scripts/check-android.sh through the device script, so it
      # needs the same JNI cross-compile toolchain as the Android foundation job:
      # the pinned NDK, a rustup toolchain with both Android targets, and
      # cargo-ndk. Without them the emulator boots and the script then dies at
      # `:app:buildAndroidJni`. Versions are read from the same pins the scripts
      # assert, so a drift fails with check-android.sh's own message.
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install the pinned cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      # Hardware acceleration is a precondition, not a nice-to-have: an API 37
      # google_apis x86_64 guest cannot reach userspace under TCG inside this
      # step's timeout. The probe lives in scripts/require-kvm-acceleration.sh so
      # this workflow and android-release.yml assert the same thing, and so every
      # failure path can explain itself - the inline predecessor was three bare
      # `test` commands that exited 1 in fifty milliseconds having printed
      # nothing, which is indistinguishable from the step not running at all.
      - name: Enable and prove KVM acceleration
        run: ./scripts/require-kvm-acceleration.sh
      # api-level 37.0 is intentional and verified: sdkmanager installs
      # system-images;android-37.0;google_apis;x86_64 on the hosted runner today.
      # The emulator boots under KVM; do not downgrade this pin.
      #
      # The hardware envelope below is load-bearing. Without `profile`/`ram-size`/
      # `heap-size`/`disk-size` the action runs a bare `avdmanager create avd`, which
      # produces the emulator's ancient fallback device: a 320x640 160dpi screen, a
      # 64 MB Dalvik heap and an undersized RAM and userdata partition. An API 37
      # google_apis x86_64 guest cannot reach userspace in that envelope, so adbd
      # never starts and `adb -s emulator-5570 shell getprop sys.boot_completed`
      # answers `device offline` until the boot timeout expires - even though KVM,
      # the system image and the emulator process itself are all healthy. Give the
      # guest a real Pixel profile and enough RAM, heap and disk to finish booting.
      #
      # `cores` is the one knob that is deliberately NOT maximal. ubuntu-24.04 is
      # a 4-vCPU runner, so `cores: 4` hands the guest every host CPU and leaves
      # nothing for the emulator's own render/IO threads, adbd, the Gradle JVM and
      # the two Rust node containers this gate starts as its test fixture. That
      # oversubscription is not a slowdown, it is a kill: Android's Watchdog
      # aborts system_server once a monitored lock stays blocked for 60s, and CPU
      # starvation is exactly how that lock gets held. Three runs died three
      # different ways inside that window - an NPE in StorageManagerService, then
      # `Can't find service: package`, then DeadObjectException out of
      # `IActivityManager$Stub$Proxy.startInstrumentation` - all of them twelve
      # seconds after scripts/wait-for-android-guest.sh had proved the guest
      # healthy and stable across four samples. Those are three surfaces of one
      # fault. The guest only has to run instrumentation, not compile anything:
      # every build this gate needs is already done by
      # `pre-emulator-launch-script` before the guest boots.
      #
      # Two cores was the answer to that Watchdog window and it did stop the
      # kills, but it bought that at a price the honest readiness gate then
      # measured: on two cores this guest never settles at all. Fifteen minutes
      # of sampling gave `procs_running` mean 27.9 (min 5, max 76) with
      # `procs_blocked` 0 and no downward trend across the window, and the run
      # ended on a real binder failure - PackageManagerService could not answer
      # `cmd package path android` inside 3s. That is not a heuristic being
      # fussy. For calibration, an API 37 guest given four cores settles to
      # `procs_running` 1-2, so the ceiling the gate enforces is reachable; two
      # cores is simply not enough CPU for this image to finish becoming
      # itself.
      #
      # Three, not four. Four hands the guest every host vCPU and leaves
      # nothing for the emulator's own render/IO threads, adbd and the host-side
      # adb server - which is the oversubscription that caused the kills above.
      # Three raises guest capacity by half while keeping one vCPU on the host
      # side of the boundary. This is the only variable changed in this commit,
      # so if the runqueue still does not drain, the next step is four.
      #
      # An ATD image (`aosp_atd`/`google_atd`) would be the better answer and is
      # not available: at API 37 the SDK publishes only `google_apis`,
      # `google_apis_playstore` and their `_ps16k` variants. ATD stops at
      # android-36. Nothing in this app needs GMS - there is no Play Services,
      # Firebase, Play Integrity or `GoogleApiAvailability` reference anywhere in
      # apps/android/app/src - so the moment an API 37 ATD image ships, switch
      # `target` to `aosp_atd` and revisit this number.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          avd-name: Covalent_API_37
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8G
          emulator-port: 5570
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          # Two things happen before launch, and the second one is why this job
          # was red.
          #
          # Start the adb server before the emulator so it can register itself
          # instead of logging "Unable to connect to adb daemon on port: 5037" and
          # leaving the action to discover the device by port scan.
          #
          # Then do the gate's cold build work while no guest is running.
          # scripts/android-api37-device-test.sh runs check-android.sh and then
          # builds packaging/docker/Dockerfile, and both are full cold Rust
          # release compiles. Reached through this action's `script:` payload they
          # ran with the API 37 guest already booted, so a 4-vCPU runner sat at
          # full load for 20-23 minutes while the guest was descheduled, and the
          # guest did not survive it:
          #
          #   * Run 32481440600, before the Direct Boot fix, reached
          #     instrumentation with user 0 STILL LOCKED twenty minutes after
          #     sys.boot_completed - the app died with "SharedPreferences in
          #     credential encrypted storage are not available until after user
          #     (id 0) is unlocked". A healthy API 37 guest reports
          #     sys.user.0.ce_available=true in the same second it reports
          #     sys.boot_completed=1; measured cold on this AVD, both flip at 17s.
          #   * Runs 32488425852 and 32491119888 reported
          #     "INSTRUMENTATION_ABORTED: System has crashed." with ZERO tests
          #     recorded. That is the string `am instrument`'s death recipient on
          #     the system_server binder prints when system_server dies under it,
          #     so no test had run and none could have caused it.
          #
          # These two lines are not a cache warm-up. They are the gate's build
          # half, run in full, here, where no guest exists to starve. The device
          # script is then told so with COVALENT_ANDROID_PREBUILT=true below and
          # skips the *rebuild* only - it still runs check-android.sh, in
          # --verify-prebuilt mode, which proves every artifact these two lines
          # were supposed to produce is present and newer than every source it is
          # built from, re-reads the unit test and lint reports to confirm they
          # were a clean pass, applies the same freshness proof to the image
          # tagged here, and runs the instrumentation-result contract battery
          # unchanged. Nothing the gate proves changes; the work moves off the
          # window where the guest is fragile instead of being done twice.
          #
          # Warming a cache was the previous attempt at this and it was not
          # enough. With every cache warm the device script's own re-run of these
          # two still cost 68 seconds of full-load 4-vCPU time, and run
          # 32499985083 died inside it: `adb install` hit a null
          # PackageManagerInternal in StorageManagerService 68 seconds after an
          # identical install had succeeded. The load has to be absent, not fast.
          #
          # Every line below is one whole command. This action does not run these
          # payloads as a script: it splits them on newlines and runs each line in
          # its own `sh -c`, so continuations, multi-line `while`/`if`, and shell
          # variables carried between lines all break. The docker build here used
          # backslash continuations and had been failing since it was added -
          # `sh -c "docker build \"` passes a literal backslash as the context and
          # dies with `unable to prepare context: path "\" not found`, which this
          # action reports and then continues past. So the warm BuildKit layer this
          # comment describes was never actually warmed, and the gate script's own
          # cold docker build ran with the guest already up - the exact starvation
          # the reordering exists to prevent. One line, no continuations.
          pre-emulator-launch-script: |
            "$ANDROID_HOME/platform-tools/adb" start-server
            ./scripts/check-android.sh
            docker build --file packaging/docker/Dockerfile --build-arg VCS_REF=$(git rev-parse HEAD) --tag covalent:android-api37-e2e .
          # `swangle_indirect`, not `swiftshader_indirect`. This is the fix for the
          # fault that has kept this lane red, and it is a renderer fault, not a
          # memory or CPU one.
          #
          # Run 32539492995 recorded the guest's event and crash buffers across the
          # whole readiness window for the first time. system_server's pid climbed
          # 3835 -> 5958 -> 8124 -> 10214 -> 12313 -> 14504 and never once survived
          # past 26 seconds of uptime, and the tombstone directory filled at one
          # file every ~29 seconds. The tombstone names the cause exactly:
          #
          #   Executable: /system/bin/surfaceflinger   Process uptime: 30s
          #   name: RegionSampling  >>> /system/bin/surfaceflinger <<<
          #   signal 6 (SIGABRT), code -1 (SI_QUEUE)
          #   Abort message: 'Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma'
          #     #03 mapper.ranchu.so  GoldfishMapper::readFromHost(cb_handle_t const&)
          #     #05 libui.so          Gralloc5Mapper::lock(...)
          #     #09 surfaceflinger    RegionSamplingThread::threadMain()
          #
          # NexusLauncher registers a CompositionSamplingListener to pick status bar
          # icon contrast; SurfaceFlinger's RegionSamplingThread CPU-locks the
          # composited buffer to read it; the API 37 guest's Gralloc5 mapper asserts
          # that the host has NOT advertised ANDROID_EMU_read_color_buffer_dma, and
          # the host has. surfaceflinger aborts, system_server follows it down, the
          # framework restarts, the launcher comes back and registers the listener
          # again. That loop is every symptom this gate has ever reported: a runqueue
          # that never drains because each cycle is a fresh boot storm, binder probes
          # timing out at random, and ComponentActivity failing to resolve at LOW
          # runqueue - user 0 is briefly re-locked after each restart, and Direct Boot
          # matches only direct-boot-aware components while it is.
          #
          # It is emphatically not memory. The same dump read MemAvailable 3356216 kB
          # of 4008944 kB with SwapFree 3006116 of 3006704 - swap essentially
          # untouched. The "173 MB free" that suggested an OOM loop was free-versus-
          # available: 2.1 GB of it was reclaimable page cache.
          #
          # Why this flag. `-gpu swiftshader_indirect` does not name one renderer, it
          # names a preference that resolves per host. On this runner it resolves to
          # the legacy path - the CI log reads `emuglConfig_init:
          # vulkan_mode_selected:swiftshader gles_mode_selected:swiftshader` and then
          # `Graphics Adapter Android Emulator OpenGL ES Translator (Google
          # SwiftShader)` - which is the translator that advertises
          # ANDROID_EMU_read_color_buffer_dma. Locally, the identical emulator build
          # (37.1.11.0, build_id 15917651) with the identical flag resolves instead to
          # `ANGLE (Google, Vulkan 1.3.0 (SwiftShader Device), SwiftShader driver)`,
          # never advertises that extension, never aborts, and runs all 56
          # instrumentation tests green twice over. `swangle_indirect` - "use ANGLE
          # with the SwiftShader backend for GLES and Vulkan" - asks for that second
          # renderer by name instead of leaving the choice to the host, so CI gets the
          # configuration that is known to work rather than the one that is known to
          # abort. It is also the emulator team's documented recommendation for
          # headless CI.
          #
          # This is the only variable changed in this commit.
          emulator-options: -no-snapshot -no-window -gpu swangle_indirect -noaudio -no-boot-anim -no-metrics -accel on
          # Wait for the unlock, not just for the boot.
          #
          # This action's only readiness check is `getprop sys.boot_completed`, and
          # nothing here or in the gate script ever waited for anything more. That
          # was survivable purely by accident: until the reordering above, the cold
          # Rust and Docker builds ran inside this `script:` payload, so `am
          # instrument` started twenty minutes after boot and user 0 had long since
          # unlocked. Moving those builds before launch was right, and it also
          # removed the accidental delay - run 32495908942 reached instrumentation
          # two seconds after sys.boot_completed with user 0 STILL LOCKED, and 40 of
          # 56 tests failed. All four symptoms are one cause:
          #
          #   * DirectBootStorageTest#theRealDeviceReportsItsOwnUnlockState failed on
          #     its own assertion "The instrumentation host is unlocked" - the gate
          #     measured UserManager.isUserUnlocked() == false and said so directly.
          #   * IdentityKeyProtectorTest got expected:<SOFTWARE> but was:<UNAVAILABLE>,
          #     because the Direct Boot gate fail-closes on a locked user by design.
          #     That is correct behaviour on a locked device, so the environment is
          #     what is wrong, not the assertion.
          #   * 8x "SharedPreferences in credential encrypted storage are not
          #     available until after user (id 0) is unlocked".
          #   * 77x "Unable to resolve activity for: ... androidx.activity.
          #     ComponentActivity". This one reads like a missing
          #     androidx.compose.ui:ui-test-manifest and is not: the stub is declared
          #     debugImplementation and is present in the app's merged debug manifest.
          #     A locked user makes PackageManager match only direct-boot-aware
          #     components, so the stub is filtered out of resolveActivity, androidx
          #     .test falls back to the test package, and that fails too.
          #
          # No test can unlock user 0 from inside instrumentation, so establishing an
          # unlocked device is this harness's job; the suite already fails closed with
          # a legible message when the harness does not do it. Both properties flip in
          # the same second on a healthy cold boot of this AVD - measured at 17s - so
          # this costs seconds, and when it does not happen it reports what it saw
          # instead of handing the suite a device that cannot pass.
          # The one-command-per-line rule still applies here, and the readiness
          # logic has outgrown what a single `until` can say honestly, so it now
          # lives in scripts/wait-for-android-guest.sh where it can be read,
          # reviewed and run by hand. What follows is why it needs to be that
          # long.
          #
          # The second lesson is the same one layer down. Once the warm
          # BuildKit cache above actually worked, the gate stopped spending
          # twelve minutes rebuilding and reached `adb install` 73 seconds after
          # boot - and run 32499985083 died there:
          #
          #   java.lang.NullPointerException: Attempt to invoke virtual method
          #   'void android.content.pm.PackageManagerInternal.freeStorage(...)'
          #   on a null object reference
          #     at com.android.server.StorageManagerService.allocateBytes
          #     at com.android.server.pm.PackageInstallerSession.doWriteInternal
          #
          # PackageManagerInternal is registered into LocalServices some time
          # after sys.boot_completed on this image, and until it is, every
          # session write that has to allocate space dies in the platform. The
          # same install succeeded in run 32495908942, where the cold rebuild had
          # accidentally delayed it to twelve minutes after boot. There is no
          # external property that reports that registration, so rather than wait
          # on a proxy and hope it correlates, wait on the capability itself: keep
          # attempting the real install until the guest accepts one. It is
          # idempotent (`-r`, and the gate script installs again anyway), it is
          # bounded, and it fails closed with `df /data` attached. Installing the
          # app is a precondition, not an assertion, so nothing the gate proves is
          # weakened by proving the device can accept it first.
          #
          # And the third lesson, which is why a probe install is no longer the
          # last word. With COVALENT_ANDROID_PREBUILT=true below there is no
          # build at all between the probe and the gate's own install - run
          # 32506293772 closed that gap to twelve seconds - and it still failed,
          # differently:
          #
          #   adb: failed to install app-debug.apk: cmd: Can't find service: package
          #
          # The probe had reported "Success" at t+0s. Twelve seconds later the
          # package binder service was gone. So the guest was not becoming ready
          # and staying ready; it was passing through a ready-looking moment. A
          # single success is a sample, not a state, and every readiness
          # definition this gate has had was a sample.
          #
          # And the fourth lesson, which is why "the services are registered" is
          # no longer the question. Run 32522700913 passed every check above at
          # t+62s of a 600s budget and the install still died, on `Broken pipe
          # (32)`. system_server had not restarted - one PID, 5240, for the whole
          # log - it was alive and paralysed: `Slow dispatch took 1863ms`,
          # repeated `Long monitor contention` on OomAdjusterImpl, lock holds up
          # to 3.3s in UserBackupManagerService.initPackageTracking. The runner
          # was saturated (4 vCPU, load 4.18) and the two-core guest's own
          # /proc/loadavg read `30.62 9.53 3.37`.
          #
          # The readiness probe could not see any of that, by construction.
          # `service check package` asks servicemanager - a small native daemon
          # holding a name->handle table - whether a name is registered. It never
          # transacts with system_server, so a guest at load 30 answers it
          # instantly. Measured against a local cold boot of this same AVD:
          # `service check package` answered "found" from t+8s and stayed
          # "found" through a load peak of 17.34, while the guest was plainly
          # not fit to install anything. A probe that cannot fail when the
          # install fails is not a probe.
          #
          # The corollary took one more run to get right. The first version of
          # this ceiling used the guest's one-minute load average, and run
          # 32526074070 sampled it 166 times across a full 900s budget: it rose
          # to ~30 within two minutes and then never fell, sitting between 24 and
          # 38 for the remaining thirteen, while the same guest reported `2/974`
          # - two runnable tasks - and answered every binder round trip in tens
          # of milliseconds. Linux's load average sums the runqueue with
          # uninterruptible IO wait, and on this runner's virtual disk the second
          # term is pinned near 30. A ceiling on the sum is not a strict
          # predicate here, it is an unsatisfiable one. `/proc/stat`'s
          # `procs_running` is the term that was actually meant, and unlike
          # `/proc/pressure/cpu` (SELinux-denied to the shell user on this image)
          # it is readable.
          #
          # `procs_running` then failed on its own terms in run 32532615844, and
          # the way it failed is the point. Gating on it reset the stability
          # window 32 times in 900s; the window only announces a reset after it
          # has banked a wholly good sample, so each of those lines records the
          # guest passing all three real binder round trips and then losing it to
          # one instantaneous reading of /proc/stat. Because the ceiling is
          # checked first and returns early, none of those 32 resets ever
          # established that system_server was unwell - and the give-up dump
          # found it answering normally. `am wait-for-broadcast-idle` calls the
          # queues idle at 17s, so the 7-to-74 oscillation over the remaining
          # 880s is not a storm draining but this image's steady background
          # behaviour, identical on two cores and three. The ceiling is therefore
          # now read and reported on every sample but does not veto one
          # (COVALENT_ANDROID_GUEST_ENFORCE_RUNQUEUE=1 restores the veto), and
          # the stability window grew from four samples to six to put the weight
          # back on the measurement that predicts the actual failure.
          #
          # So scripts/wait-for-android-guest.sh now waits for the platform to
          # describe itself as ready (boot, user 0 unlocked, boot animation
          # stopped), for the guest to answer /proc/cpuinfo and /proc/stat inside
          # the probe deadline at all, and for the package, activity and mount
          # services to each answer a real
          # binder round trip (`cmd package path android`, `cmd activity
          # get-current-user`, `dumpsys mount`) inside a latency ceiling of three
          # seconds, against a healthy figure of 317ms measured locally and under
          # 100ms on this runner.
          # It then drains the boot broadcast storm - `am wait-for-broadcast-idle`
          # is supported on this image, verified answering `All broadcast queues
          # are idle!` on an API 37 guest, and is now bounded and logged rather
          # than called unbounded with both streams discarded -
          # performs the probe install - deliberately *before* the stability
          # window, because installing is the heaviest thing that happens to a
          # young guest and is what triggers dexopt - and then, because the APK
          # is now on the device and can be asked about, requires PackageManager
          # to resolve life.michaelwong.covalent/androidx.activity.ComponentActivity.
          # That last one is what run 32535337631 cost. It handed over at 78s
          # with everything above satisfied, printed `ComponentActivity : No
          # activity found` as its very first line of instrumentation evidence,
          # and lost three AccessibilityGateTest cases to `Unable to resolve
          # activity for: ... cmp=life.michaelwong.covalent.test/androidx.activity
          # .ComponentActivity` - androidx.test falling back to the test package
          # after the app's own copy failed to resolve. ui-test-manifest is a
          # debugImplementation dependency, so that activity belongs to the app
          # and appears only once PackageManager has finished scanning the APK
          # the probe install just pushed. The gate had been dumping this exact
          # fact as post-mortem evidence without ever requiring it.
          #
          # It requires every one of
          # those conditions to hold for six consecutive samples afterwards,
          # starting the count over if any of them lapses and naming the one that
          # lapsed. It fails closed with properties, registered handles and round
          # trips side by side, both terms of the load average, storage, users
          # and a crash/system logcat
          # tail attached, which is the evidence none of the four failures above
          # left behind.
          script: |
            ./scripts/wait-for-android-guest.sh emulator-5570 apps/android/app/build/outputs/apk/debug/app-debug.apk
            $ANDROID_HOME/platform-tools/adb -s emulator-5570 shell wm dismiss-keyguard || true
            COVALENT_ANDROID_PREBUILT=true COVALENT_ANDROID_EVIDENCE_DIR="${{ runner.temp }}/covalent-android-api37" COVALENT_ANDROID_HEADLESS_CI=true ANDROID_SERIAL=emulator-5570 ./scripts/android-api37-device-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-api37-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-android-api37
          if-no-files-found: warn

  container-foundation:
    name: Container foundation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # The six gates below used to run after a `--platform linux/arm64` build in
      # this same job. That build is QEMU-emulated and is the slowest step in the
      # workflow, so across 27 runs on main it consumed the job and none of these
      # ever concluded. They test the native image and do not need the arm64 one,
      # so the arm64 build now lives in its own job and cannot shadow them.
      - run: docker buildx build --platform linux/amd64 --load --build-arg VCS_REF=${{ github.sha }} -f packaging/docker/Dockerfile -t covalent:ci .
      - run: ./scripts/check-container-contract.sh covalent:ci "${GITHUB_SHA}"
      - run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp --entrypoint covalent covalent:ci doctor
      - run: ./scripts/check-container-runtime.sh covalent:ci
      - run: ./scripts/check-artifact-budgets.sh --image-only covalent:ci --platform linux/amd64
      - run: ./scripts/validate-unraid-template.sh
      - run: ./scripts/docker-compose-e2e.sh covalent:ci

  container-arm64:
    name: Container arm64 image
    # Native arm64, not QEMU. On ubuntu-latest this job built linux/arm64 under
    # emulation and was killed at its own 45 minute timeout on every attempt it
    # ever made - it has never once completed. Emulating an entire Rust release
    # build is the wrong shape of work for QEMU, and no timeout large enough to
    # absorb it would be a timeout worth having. Raising the limit would have
    # bought a slower red; this removes the emulation instead.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # No setup-qemu-action: the runner is already arm64, so linux/arm64 is
      # this machine's native platform and there is nothing left to emulate.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --platform linux/arm64 --load --build-arg VCS_REF=${{ github.sha }} -f packaging/docker/Dockerfile -t covalent:ci-arm64 .
      - run: ./scripts/check-artifact-budgets.sh --image-only covalent:ci-arm64 --platform linux/arm64

  ios-tier2:
    name: iOS Tier 2
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: brew install xcodegen
      - run: cd apps/apple && xcodegen generate --quiet
      - run: xcodebuild -project apps/apple/Covalent.xcodeproj -scheme CovalentIOS -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      # Building the iOS app proved only that it compiles. The UI and
      # accessibility assertions in apps/apple/Scripts/ios-ui-test.sh existed but
      # ran in no job, so nothing gated on them; the macOS equivalent caught a
      # real 4.0:1 contrast regression, which this tier could not have caught.
      # Run the bounded iOS gate here and let its failure fail the workflow.
      - name: Run bounded iOS UI and accessibility gates
        env:
          COVALENT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/covalent-ios-ui
        run: apps/apple/Scripts/ios-ui-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-ui-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-ios-ui
          if-no-files-found: warn

  release-candidate-software:
    name: Release candidate software gates
    if: always()
    needs:
      - rust-and-contracts
      - macos-integration-ui
      - macos-app-bundle
      # ios-tier2 is deliberately absent. Supported platforms are Unraid,
      # macOS, and Android; iOS is out of scope for now. The job still runs on
      # every commit and is still green - it just must not block a release.
      # scripts/check-required-checks.sh enforces that this omission is
      # declared rather than accidental, and fails if the two ever disagree.
      - android-foundation
      - android-device
      - container-foundation
      - container-arm64
    runs-on: ubuntu-latest
    steps:
      # This step used to be a column of bare `test ... = success` commands. When
      # one failed it printed nothing, so the aggregate gate could not say WHICH
      # lane was red, nor tell a lane that failed apart from one that was
      # cancelled or never ran - the same confusion that let permanently-skipped
      # steps look healthy for 27 runs. Print every lane's real conclusion first,
      # then fail on the ones that are not `success`, naming them.
      - name: Require every exact-current software gate
        env:
          GATE_RESULTS: |
            Shared Rust and contracts=${{ needs.rust-and-contracts.result }}
            macOS integration and UI=${{ needs.macos-integration-ui.result }}
            macOS app bundle=${{ needs.macos-app-bundle.result }}
            Android foundation=${{ needs.android-foundation.result }}
            Android API 37 device=${{ needs.android-device.result }}
            Container foundation=${{ needs.container-foundation.result }}
            Container arm64 image=${{ needs.container-arm64.result }}
        run: |
          set -euo pipefail
          rejected=0
          echo "Software gate results for ${GITHUB_SHA}:"
          while IFS= read -r entry; do
            [ -n "${entry}" ] || continue
            gate=${entry%%=*}
            result=${entry##*=}
            printf '  %-32s %s\n' "${gate}" "${result}"
            case "${result}" in
              success) ;;
              skipped|'') echo "    ^ this gate never ran, so it proved nothing" ;;
              *) echo "    ^ this gate concluded ${result}" ;;
            esac
            [ "${result}" = success ] || rejected=1
          done <<<"$(printf '%s' "${GATE_RESULTS}" | sed 's/^[[:space:]]*//')"
          if [ "${rejected}" -ne 0 ]; then
            echo "Release candidate rejected: not every software gate concluded success." >&2
            exit 1
          fi
          echo "Software gates passed. Signing, notarization, published image, and live Unraid evidence remain separate release blockers."
