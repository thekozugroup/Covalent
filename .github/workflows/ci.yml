name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency vulnerability and license delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          license-check: true
          deny-licenses: AGPL-3.0-only, GPL-3.0-only

  rust-and-contracts:
    name: Shared Rust and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # validate-foundation.sh now requires ripgrep and jq instead of skipping
      # its scans when they are absent, so guarantee both are installed rather
      # than depending on whatever the hosted runner image happens to ship.
      - name: Install validate-foundation.sh gate dependencies
        run: |
          set -euo pipefail
          if ! command -v rg >/dev/null 2>&1 || ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ripgrep jq
          fi
          rg --version
          jq --version
      - run: ./scripts/validate-foundation.sh
      # Every release workflow re-lists the checks it demands be green. Those
      # lists read as exhaustive and were not - "iOS Tier 2" was in none of them.
      # Derive the list from this file so a new lane cannot be added without a
      # release workflow being taught to require it.
      - run: ./scripts/check-required-checks.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - run: ./scripts/smoke.sh
      - run: node --test packaging/web/tests/*.test.mjs
      - run: node scripts/check-openapi-routes.mjs
      - run: npx --yes @redocly/cli@2.46.1 lint docs/api/openapi.yaml
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources
      - run: cargo build --locked --release -p covalent-node -p covalent-cli
      - run: ./scripts/check-artifact-budgets.sh
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: covalent-source.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sbom-${{ github.sha }}
          path: covalent-source.spdx.json
          if-no-files-found: error

  macos-integration-ui:
    name: macOS integration and UI
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: brew install xcodegen
      - run: swift test --package-path apps/apple
      - name: Generate Apple dependency inventories
        env:
          SOURCE_DATE_EPOCH: "0"
        run: ./scripts/apple-dependency-inventory.sh "${RUNNER_TEMP}/covalent-apple-inventory"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-dependency-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-apple-inventory
          if-no-files-found: error
      - run: apps/apple/Scripts/integration-test.sh
      - name: Run bounded macOS UI and accessibility gates
        env:
          COVALENT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/covalent-macos-ui
        run: apps/apple/Scripts/macos-ui-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-ui-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-macos-ui
          if-no-files-found: warn

  # These steps used to sit at the end of `macos-integration-ui`, behind
  # integration-test.sh and the UI gate. Over 27 consecutive runs on main they
  # never once executed: an upstream failure skipped them every time, and a
  # skipped step is reported as nothing at all rather than as a red gate. This
  # is the ONLY place in the repository that runs verify-apple-silicon-bundle.sh
  # with COVALENT_REQUIRE_HARDENED_RUNTIME=true - arm64-only binaries, valid
  # signatures, hardened runtime and the exact app-sandbox+inherit entitlements
  # on the bundled helper - so shadowing it meant none of that was ever checked.
  # It is its own job so a UI regression can no longer hide a packaging one.
  macos-app-bundle:
    name: macOS app bundle
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: brew install xcodegen
      - run: cd apps/apple && xcodegen generate --quiet
      - run: xcodebuild -project apps/apple/Covalent.xcodeproj -scheme CovalentMac -configuration Debug -destination 'platform=macOS,arch=arm64' ARCHS=arm64 EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO build
      - name: Archive and verify the Apple Silicon app-owned node
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/CovalentMac.xcarchive"
          xcodebuild -project apps/apple/Covalent.xcodeproj -scheme CovalentMac -configuration Release -destination 'generic/platform=macOS' -archivePath "$archive_path" ARCHS=arm64 EXCLUDED_ARCHS=x86_64 CODE_SIGNING_ALLOWED=NO archive
          app="$archive_path/Products/Applications/Covalent.app"
          helper="$app/Contents/MacOS/covalent-node"
          codesign --force --options runtime --sign - --entitlements apps/apple/Config/CovalentNode.entitlements --timestamp=none "$helper"
          codesign --force --options runtime --sign - --entitlements apps/apple/Config/CovalentMac.entitlements --timestamp=none "$app"
          COVALENT_REQUIRE_HARDENED_RUNTIME=true ./scripts/verify-apple-silicon-bundle.sh "$app"
          echo "Hardened-runtime bundle gate executed and passed on $(uname -m)."

  android-foundation:
    name: Android foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      # check-android.sh runs assembleRelease, which builds the pinned JNI
      # libraries through the NDK. Install the exact pinned NDK so the gate can
      # actually run instead of failing on a missing toolchain.
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      # Building the JNI libraries is a Rust cross-compile, not just an NDK
      # invocation. scripts/build-android-jni.sh drives `cargo ndk` to produce
      # the per-ABI staticlib before it performs the final link itself, so the
      # rustup-managed toolchain, both Android targets and cargo-ndk 4.1.2 all
      # have to exist on the runner. Without them the job died at
      # `:app:buildAndroidJni` with `error: no such command: 'ndk'`; the
      # staticlib restructure moved the *link* out of rustc's hands but left the
      # compile step on cargo-ndk. Versions are pinned to what the script
      # asserts so a drift fails here with a clear message.
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install the pinned cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      # The "JNI_OnLoad only" export contract is enforced from two sides: this
      # source-level gate asserts the staticlib + exports.map arrangement that
      # makes the contract expressible, and the per-ABI .dynsym audit inside
      # scripts/build-android-jni.sh (run below through assembleRelease) proves
      # the linked arm64-v8a and x86_64 objects actually honour it. The script
      # existed with no caller anywhere in the repo, so it gated nothing.
      - run: ./scripts/check-android-jni-contract.sh
      - run: ./scripts/check-android.sh
      - run: ./apps/android/gradlew -p apps/android :app:generateAndroidSbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-dependency-inventory-${{ github.sha }}
          path: |
            apps/android/app/build/reports/covalent/android-sbom.cdx.json
            apps/android/app/build/reports/covalent/android-license-inventory.json
          if-no-files-found: error

  android-device:
    name: Android API 37 device
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      # This gate runs scripts/check-android.sh through the device script, so it
      # needs the same JNI cross-compile toolchain as the Android foundation job:
      # the pinned NDK, a rustup toolchain with both Android targets, and
      # cargo-ndk. Without them the emulator boots and the script then dies at
      # `:app:buildAndroidJni`. Versions are read from the same pins the scripts
      # assert, so a drift fails with check-android.sh's own message.
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install the pinned cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      # Hardware acceleration is a precondition, not a nice-to-have: an API 37
      # google_apis x86_64 guest cannot reach userspace under TCG inside this
      # step's timeout. The probe lives in scripts/require-kvm-acceleration.sh so
      # this workflow and android-release.yml assert the same thing, and so every
      # failure path can explain itself - the inline predecessor was three bare
      # `test` commands that exited 1 in fifty milliseconds having printed
      # nothing, which is indistinguishable from the step not running at all.
      - name: Enable and prove KVM acceleration
        run: ./scripts/require-kvm-acceleration.sh
      # api-level 37.0 is intentional and verified: sdkmanager installs
      # system-images;android-37.0;google_apis;x86_64 on the hosted runner today.
      # The emulator boots under KVM; do not downgrade this pin.
      #
      # The hardware envelope below is load-bearing. Without `profile`/`ram-size`/
      # `heap-size`/`disk-size` the action runs a bare `avdmanager create avd`, which
      # produces the emulator's ancient fallback device: a 320x640 160dpi screen, a
      # 64 MB Dalvik heap and an undersized RAM and userdata partition. An API 37
      # google_apis x86_64 guest cannot reach userspace in that envelope, so adbd
      # never starts and `adb -s emulator-5570 shell getprop sys.boot_completed`
      # answers `device offline` until the boot timeout expires - even though KVM,
      # the system image and the emulator process itself are all healthy. Give the
      # guest a real Pixel profile and enough RAM, heap and disk to finish booting.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          avd-name: Covalent_API_37
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8G
          emulator-port: 5570
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          # Two things happen before launch, and the second one is why this job
          # was red.
          #
          # Start the adb server before the emulator so it can register itself
          # instead of logging "Unable to connect to adb daemon on port: 5037" and
          # leaving the action to discover the device by port scan.
          #
          # Then do the gate's cold build work while no guest is running.
          # scripts/android-api37-device-test.sh runs check-android.sh and then
          # builds packaging/docker/Dockerfile, and both are full cold Rust
          # release compiles. Reached through this action's `script:` payload they
          # ran with the API 37 guest already booted, so a 4-vCPU runner sat at
          # full load for 20-23 minutes while the guest was descheduled, and the
          # guest did not survive it:
          #
          #   * Run 32481440600, before the Direct Boot fix, reached
          #     instrumentation with user 0 STILL LOCKED twenty minutes after
          #     sys.boot_completed - the app died with "SharedPreferences in
          #     credential encrypted storage are not available until after user
          #     (id 0) is unlocked". A healthy API 37 guest reports
          #     sys.user.0.ce_available=true in the same second it reports
          #     sys.boot_completed=1; measured cold on this AVD, both flip at 17s.
          #   * Runs 32488425852 and 32491119888 reported
          #     "INSTRUMENTATION_ABORTED: System has crashed." with ZERO tests
          #     recorded. That is the string `am instrument`'s death recipient on
          #     the system_server binder prints when system_server dies under it,
          #     so no test had run and none could have caused it.
          #
          # Building here leaves Gradle, cargo and the BuildKit layer cache warm.
          # The gate script still runs check-android.sh and the same docker build
          # itself, and still has to pass both - it just reaches `am instrument` a
          # minute after boot instead of twenty. Nothing the gate proves changes.
          # BuildKit keys its layer cache on content, so the docker build below
          # warms the expensive Rust layer even if the script retags the image.
          pre-emulator-launch-script: |
            set -eu
            "$ANDROID_HOME/platform-tools/adb" start-server
            ./scripts/check-android.sh
            docker build \
              --file packaging/docker/Dockerfile \
              --tag covalent:android-api37-e2e \
              .
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -accel on
          # Wait for the unlock, not just for the boot.
          #
          # This action's only readiness check is `getprop sys.boot_completed`, and
          # nothing here or in the gate script ever waited for anything more. That
          # was survivable purely by accident: until the reordering above, the cold
          # Rust and Docker builds ran inside this `script:` payload, so `am
          # instrument` started twenty minutes after boot and user 0 had long since
          # unlocked. Moving those builds before launch was right, and it also
          # removed the accidental delay - run 32495908942 reached instrumentation
          # two seconds after sys.boot_completed with user 0 STILL LOCKED, and 40 of
          # 56 tests failed. All four symptoms are one cause:
          #
          #   * DirectBootStorageTest#theRealDeviceReportsItsOwnUnlockState failed on
          #     its own assertion "The instrumentation host is unlocked" - the gate
          #     measured UserManager.isUserUnlocked() == false and said so directly.
          #   * IdentityKeyProtectorTest got expected:<SOFTWARE> but was:<UNAVAILABLE>,
          #     because the Direct Boot gate fail-closes on a locked user by design.
          #     That is correct behaviour on a locked device, so the environment is
          #     what is wrong, not the assertion.
          #   * 8x "SharedPreferences in credential encrypted storage are not
          #     available until after user (id 0) is unlocked".
          #   * 77x "Unable to resolve activity for: ... androidx.activity.
          #     ComponentActivity". This one reads like a missing
          #     androidx.compose.ui:ui-test-manifest and is not: the stub is declared
          #     debugImplementation and is present in the app's merged debug manifest.
          #     A locked user makes PackageManager match only direct-boot-aware
          #     components, so the stub is filtered out of resolveActivity, androidx
          #     .test falls back to the test package, and that fails too.
          #
          # No test can unlock user 0 from inside instrumentation, so establishing an
          # unlocked device is this harness's job; the suite already fails closed with
          # a legible message when the harness does not do it. Both properties flip in
          # the same second on a healthy cold boot of this AVD - measured at 17s - so
          # this costs seconds, and when it does not happen it reports what it saw
          # instead of handing the suite a device that cannot pass.
          script: |
            set -eu
            adb="$ANDROID_HOME/platform-tools/adb"
            serial=emulator-5570
            deadline=$(($(date +%s) + 300))
            while :; do
              booted=$("$adb" -s "$serial" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              unlocked=$("$adb" -s "$serial" shell getprop sys.user.0.ce_available 2>/dev/null | tr -d '\r' || true)
              if [ "$booted" = 1 ] && [ "$unlocked" = true ]; then
                break
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "user 0 never unlocked on $serial after 300s:" >&2
                echo "  sys.boot_completed=${booted:-<unset>} sys.user.0.ce_available=${unlocked:-<unset>}" >&2
                "$adb" -s "$serial" shell dumpsys user >&2 || true
                exit 1
              fi
              sleep 2
            done
            echo "user 0 is unlocked: sys.boot_completed=$booted sys.user.0.ce_available=$unlocked"
            "$adb" -s "$serial" shell wm dismiss-keyguard >/dev/null 2>&1 || true
            COVALENT_ANDROID_EVIDENCE_DIR="${{ runner.temp }}/covalent-android-api37" \
              COVALENT_ANDROID_HEADLESS_CI=true \
              ANDROID_SERIAL="$serial" \
              ./scripts/android-api37-device-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-api37-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-android-api37
          if-no-files-found: warn

  container-foundation:
    name: Container foundation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # The six gates below used to run after a `--platform linux/arm64` build in
      # this same job. That build is QEMU-emulated and is the slowest step in the
      # workflow, so across 27 runs on main it consumed the job and none of these
      # ever concluded. They test the native image and do not need the arm64 one,
      # so the arm64 build now lives in its own job and cannot shadow them.
      - run: docker buildx build --platform linux/amd64 --load --build-arg VCS_REF=${{ github.sha }} -f packaging/docker/Dockerfile -t covalent:ci .
      - run: ./scripts/check-container-contract.sh covalent:ci "${GITHUB_SHA}"
      - run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --tmpfs /tmp --entrypoint covalent covalent:ci doctor
      - run: ./scripts/check-container-runtime.sh covalent:ci
      - run: ./scripts/check-artifact-budgets.sh --image-only covalent:ci --platform linux/amd64
      - run: ./scripts/validate-unraid-template.sh
      - run: ./scripts/docker-compose-e2e.sh covalent:ci

  container-arm64:
    name: Container arm64 image
    # Native arm64, not QEMU. On ubuntu-latest this job built linux/arm64 under
    # emulation and was killed at its own 45 minute timeout on every attempt it
    # ever made - it has never once completed. Emulating an entire Rust release
    # build is the wrong shape of work for QEMU, and no timeout large enough to
    # absorb it would be a timeout worth having. Raising the limit would have
    # bought a slower red; this removes the emulation instead.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # No setup-qemu-action: the runner is already arm64, so linux/arm64 is
      # this machine's native platform and there is nothing left to emulate.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker buildx build --platform linux/arm64 --load --build-arg VCS_REF=${{ github.sha }} -f packaging/docker/Dockerfile -t covalent:ci-arm64 .
      - run: ./scripts/check-artifact-budgets.sh --image-only covalent:ci-arm64 --platform linux/arm64

  ios-tier2:
    name: iOS Tier 2
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: brew install xcodegen
      - run: cd apps/apple && xcodegen generate --quiet
      - run: xcodebuild -project apps/apple/Covalent.xcodeproj -scheme CovalentIOS -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
      # Building the iOS app proved only that it compiles. The UI and
      # accessibility assertions in apps/apple/Scripts/ios-ui-test.sh existed but
      # ran in no job, so nothing gated on them; the macOS equivalent caught a
      # real 4.0:1 contrast regression, which this tier could not have caught.
      # Run the bounded iOS gate here and let its failure fail the workflow.
      - name: Run bounded iOS UI and accessibility gates
        env:
          COVALENT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/covalent-ios-ui
        run: apps/apple/Scripts/ios-ui-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-ui-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-ios-ui
          if-no-files-found: warn

  release-candidate-software:
    name: Release candidate software gates
    if: always()
    needs:
      - rust-and-contracts
      - macos-integration-ui
      - macos-app-bundle
      # ios-tier2 is deliberately absent. Supported platforms are Unraid,
      # macOS, and Android; iOS is out of scope for now. The job still runs on
      # every commit and is still green - it just must not block a release.
      # scripts/check-required-checks.sh enforces that this omission is
      # declared rather than accidental, and fails if the two ever disagree.
      - android-foundation
      - android-device
      - container-foundation
      - container-arm64
    runs-on: ubuntu-latest
    steps:
      # This step used to be a column of bare `test ... = success` commands. When
      # one failed it printed nothing, so the aggregate gate could not say WHICH
      # lane was red, nor tell a lane that failed apart from one that was
      # cancelled or never ran - the same confusion that let permanently-skipped
      # steps look healthy for 27 runs. Print every lane's real conclusion first,
      # then fail on the ones that are not `success`, naming them.
      - name: Require every exact-current software gate
        env:
          GATE_RESULTS: |
            Shared Rust and contracts=${{ needs.rust-and-contracts.result }}
            macOS integration and UI=${{ needs.macos-integration-ui.result }}
            macOS app bundle=${{ needs.macos-app-bundle.result }}
            Android foundation=${{ needs.android-foundation.result }}
            Android API 37 device=${{ needs.android-device.result }}
            Container foundation=${{ needs.container-foundation.result }}
            Container arm64 image=${{ needs.container-arm64.result }}
        run: |
          set -euo pipefail
          rejected=0
          echo "Software gate results for ${GITHUB_SHA}:"
          while IFS= read -r entry; do
            [ -n "${entry}" ] || continue
            gate=${entry%%=*}
            result=${entry##*=}
            printf '  %-32s %s\n' "${gate}" "${result}"
            case "${result}" in
              success) ;;
              skipped|'') echo "    ^ this gate never ran, so it proved nothing" ;;
              *) echo "    ^ this gate concluded ${result}" ;;
            esac
            [ "${result}" = success ] || rejected=1
          done <<<"$(printf '%s' "${GATE_RESULTS}" | sed 's/^[[:space:]]*//')"
          if [ "${rejected}" -ne 0 ]; then
            echo "Release candidate rejected: not every software gate concluded success." >&2
            exit 1
          fi
          echo "Software gates passed. Signing, notarization, published image, and live Unraid evidence remain separate release blockers."
