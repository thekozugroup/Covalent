name: macOS native diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-native-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-integration-ui:
    name: macOS integration and UI
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: "1.26.7"
          cache: false
      - uses: dtolnay/rust-toolchain@032958afbdc797a9164d3bc0b56325c1308924a5 # 1.97.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Require an Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - run: ./scripts/test-macos-open-source-notices.sh
      - run: ./scripts/test-macos-sync-engine-packaging.sh
      - run: brew install xcodegen
      - run: swift test --package-path apps/apple
      - name: Generate Apple dependency inventories
        env:
          SOURCE_DATE_EPOCH: "0"
        run: ./scripts/apple-dependency-inventory.sh "${RUNNER_TEMP}/covalent-apple-inventory"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apple-dependency-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-apple-inventory
          if-no-files-found: error
      - run: apps/apple/Scripts/integration-test.sh
      - name: Run bounded macOS UI and accessibility gates
        env:
          COVALENT_TEST_ARTIFACT_DIR: ${{ runner.temp }}/covalent-macos-ui
        run: apps/apple/Scripts/macos-ui-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-ui-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/covalent-macos-ui
          if-no-files-found: warn
