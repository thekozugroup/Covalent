name: Container supply chain

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/thekozugroup/covalent
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/thekozugroup/covalent@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: covalent.spdx.json
      - uses: anchore/scan-action@v6
        with:
          image: ghcr.io/thekozugroup/covalent@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
      - uses: actions/upload-artifact@v4
        with:
          name: covalent-spdx-sbom
          path: covalent.spdx.json
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/thekozugroup/covalent@${{ steps.build.outputs.digest }}
