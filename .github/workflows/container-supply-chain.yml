name: Container supply chain

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed version for this exact commit
        required: true
        type: string

permissions:
  contents: write
  checks: read
  security-events: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/thekozugroup/covalent

jobs:
  validate:
    name: Validate source and release gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish_latest: ${{ steps.release.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release version must be an explicit v-prefixed semantic version" >&2
            exit 1
          fi
          workspace_version=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ "${version#v}" != "${workspace_version}" ]]; then
            echo "${version} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "${version}")" != "${GITHUB_SHA}" ]]; then
            echo "tag does not resolve to the workflow commit" >&2
            exit 1
          fi
          checks=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          for required in "Shared Rust and contracts" "macOS integration and UI" "macOS app bundle" "Android foundation" "Android API 37 device" "Container foundation" "Container arm64 image" "CodeQL java-kotlin" "CodeQL swift" "CodeQL policy" "Release candidate software gates"; do
            if ! jq -e --arg name "${required}" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at // .created_at) | last | select(.status == "completed" and .conclusion == "success")' <<<"${checks}" >/dev/null; then
              echo "latest required exact-commit check is not green: ${required}" >&2
              exit 1
            fi
          done
          ./scripts/release-version.sh check
          ./scripts/verify-release-commit-signature.sh
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          if [[ "${version}" == *-* ]]; then
            echo "publish_latest=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish_latest=true" >> "${GITHUB_OUTPUT}"
          fi

  build-digests:
    name: Build immutable ${{ matrix.platform }} digest
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            artifact: amd64
          - platform: linux/arm64
            artifact: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
      - run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  verify-and-promote:
    name: Scan, attest, then promote release tags
    needs: [validate, build-digests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: manifest
        run: |
          set -euo pipefail
          staging="${IMAGE}:staging-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          sources=()
          for digest_file in "${RUNNER_TEMP}"/digests/*; do
            sources+=("${IMAGE}@sha256:$(basename "${digest_file}")")
          done
          docker buildx imagetools create --tag "${staging}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${staging}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "staging=${staging}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE}@${digest}"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: covalent-container.spdx.json
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          fail-build: true
          severity-cutoff: high
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and attest the scanned immutable digest
        run: |
          set -euo pipefail
          subject="${IMAGE}@${{ steps.manifest.outputs.digest }}"
          cosign sign --yes "${subject}"
          cosign attest --yes --type spdxjson --predicate covalent-container.spdx.json "${subject}"
      - name: Promote verified digest to release tags
        run: |
          set -euo pipefail
          subject="${IMAGE}@${{ steps.manifest.outputs.digest }}"
          args=(--tag "${IMAGE}:${{ needs.validate.outputs.version }}")
          if [[ "${{ needs.validate.outputs.publish_latest }}" == "true" ]]; then
            args+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${args[@]}" "${subject}"
      - name: Record the released image digest and checksums
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          cat > covalent-container-digest.txt <<EOF
          image: ${IMAGE}:${RELEASE_VERSION}
          digest: ${IMAGE}@${IMAGE_DIGEST}
          platforms: linux/amd64, linux/arm64
          commit: ${GITHUB_SHA}
          verify: cosign verify ${IMAGE}@${IMAGE_DIGEST} --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" --certificate-oidc-issuer https://token.actions.githubusercontent.com
          EOF
          sha256sum covalent-container.spdx.json covalent-container-digest.txt \
            > covalent-container-SHA256SUMS.txt
          cat covalent-container-digest.txt
      - name: Publish container evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./scripts/publish-release-assets.sh "${RELEASE_VERSION}" \
            covalent-container.spdx.json \
            covalent-container-digest.txt \
            covalent-container-SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom-${{ github.sha }}
          path: |
            covalent-container.spdx.json
            covalent-container-digest.txt
            covalent-container-SHA256SUMS.txt
          if-no-files-found: error
