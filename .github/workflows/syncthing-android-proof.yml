name: Experimental Syncthing Android engine proof

on:
  workflow_dispatch:
  push:
    branches:
      - codex/syncthing-android-proof

permissions:
  contents: read

concurrency:
  group: syncthing-android-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api37-executable-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Checkout exact official Syncthing v2.1.3 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: syncthing/syncthing
          ref: 946e2b83a1f6c6ae119427c09e0a5802940b82ff
          path: .proof-syncthing
          fetch-depth: 1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.7"
          cache: false
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build both helpers and proof APKs before emulator boot
        env:
          SYNCTHING_SOURCE_DIR: ${{ github.workspace }}/.proof-syncthing
        run: |
          export COVALENT_ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          proof=experiments/syncthing-android
          "$proof/gradlew" -p "$proof" --no-daemon --dependency-verification=strict \
            -PsyncthingSourceDir="$SYNCTHING_SOURCE_DIR" \
            :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable and prove KVM acceleration
        run: ./scripts/require-kvm-acceleration.sh
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          avd-name: Covalent_API_37
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          heap-size: 576M
          disk-size: 8G
          emulator-port: 5570
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -accel on
          script: |
            export ANDROID_SERIAL=emulator-5570
            experiments/syncthing-android/run-api37-proof.sh --prebuilt
      - name: Preserve proof build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: syncthing-android-engine-proof-${{ github.sha }}
          path: |
            experiments/syncthing-android/app/build/generated/syncthingProof/assets/syncthing-sha256.txt
            experiments/syncthing-android/app/build/outputs/apk/debug/app-debug.apk
            experiments/syncthing-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
