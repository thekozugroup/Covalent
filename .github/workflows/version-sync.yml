name: Release version sync

# The Cargo workspace version is the version of record. Android, Apple, and the
# Unraid template all derive from it, and this gate fails the moment any of them
# drifts, instead of letting a release workflow discover it at tag time.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-sync:
    name: Every release surface agrees on one version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/release-version.sh check
      - run: ./scripts/validate-unraid-template.sh
