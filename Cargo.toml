[workspace]
resolver = "2"
members = [
    "crates/covalent-cli",
    "crates/covalent-core",
    "crates/covalent-ffi",
    "crates/covalent-node",
    "crates/covalent-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["thekozugroup <thekozugroup@gmail.com>"]
license = "MIT"
repository = "https://github.com/thekozugroup/Covalent"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
base64 = "0.22.1"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde", "zeroize"] }
filetime = "0.2.26"
fs2 = "0.4.3"
globset = "0.4.18"
hkdf = "0.12.4"
http-body-util = "0.1.3"
mdns-sd = "0.17.1"
proptest = "1.9.0"
quinn = "0.11.9"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = { version = "0.14.3", features = ["crypto", "pem"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
rustix = { version = "1.1.2", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
zeroize = { version = "1.8.2", features = ["derive", "serde"] }
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
