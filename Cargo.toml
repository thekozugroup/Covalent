[workspace]
resolver = "2"
members = [
    "crates/covalent-cli",
    "crates/covalent-core",
    "crates/covalent-ffi",
    "crates/covalent-node",
    "crates/covalent-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["thekozugroup <thekozugroup@gmail.com>"]
license = "MIT"
repository = "https://github.com/thekozugroup/Covalent"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
blake3 = "1.8.2"
clap = { version = "4.5.51", features = ["derive", "env"] }
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
