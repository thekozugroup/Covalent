[workspace]
resolver = "2"
members = [
    "crates/covalent-cli",
    "crates/covalent-android-jni",
    "crates/covalent-core",
    "crates/covalent-ffi",
    "crates/covalent-node",
    "crates/covalent-protocol",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["thekozugroup <thekozugroup@gmail.com>"]
license = "MIT"
repository = "https://github.com/thekozugroup/Covalent"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
base64 = "0.22.1"
blake3 = "1.8.2"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.51", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "serde", "zeroize"] }
filetime = "0.2.26"
fs2 = "0.4.3"
globset = "0.4.18"
hkdf = "0.13.0"
http-body-util = "0.1.3"
if-addrs = "0.14.0"
jni = "0.22.4"
mdns-sd = "0.17.1"
proptest = "1.9.0"
quinn = "0.11.9"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = { version = "0.14.3", features = ["crypto", "pem"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std"] }
rustix = { version = "1.1.2", features = ["fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
walkdir = "2.5.0"
zeroize = { version = "1.8.2", features = ["derive", "serde"] }
zip = { version = "8.1.0", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
# `fat` rather than `thin`: the Android JNI library links the whole node runtime
# (QUIC + TLS + HTTP) into one artefact, so cross-crate dead-code elimination is
# worth real bytes there. Measured on 2026-08-21, arm64-v8a/x86_64 Android and
# aarch64-apple-darwin host, all four artefacts shrank and none regressed:
#   libcovalent_android_jni.so arm64-v8a  9,260,232 -> 8,369,248  (-9.6%)
#   libcovalent_android_jni.so x86_64    10,952,432 -> 9,942,680  (-9.2%)
#   covalent-node                         9,681,168 -> 9,047,744  (-6.5%)
#   covalent CLI                          3,597,456 -> 3,334,544  (-7.3%)
# Cost is build time: a warm-cache release build of covalent-node + covalent-cli
# went from seconds to 1m36s. That is paid once per release lane and buys ~890 KB
# off every arm64 phone install, so it is the right side of the trade.
#
# `panic = "abort"` would strip a further ~1 MB of .eh_frame/.gcc_except_table,
# and is deliberately NOT set: crates/covalent-android-jni/src/lib.rs wraps every
# JNI entry point in `catch_unwind` so a panic in the node runtime surfaces as
# JNI_ERR. Aborting instead would turn a recoverable error into a process kill on
# the user's phone. That is cutting function to buy bytes, not an optimisation.
lto = "fat"
strip = "symbols"
