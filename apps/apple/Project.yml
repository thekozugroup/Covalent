name: Covalent
options:
  bundleIdPrefix: life.michaelwong.covalent
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1000"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  CovalentMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/CovalentShared
      - path: Sources/CovalentMac
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: Config/CovalentMac-Info.plist
      properties:
        CFBundleDisplayName: Covalent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 The Kozu Group
        NSLocalNetworkUsageDescription: Covalent finds backup devices you choose to pair on your local network.
        NSBonjourServices:
          - _covalent._udp
    entitlements:
      path: Config/CovalentMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.michaelwong.covalent.macos
        PRODUCT_NAME: Covalent
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
    preBuildScripts:
      - path: Scripts/build-node-helper.sh
        name: Build bundled Covalent node
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: true
      testTargets:
        - CovalentMacUITests
  CovalentIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/CovalentShared
      - path: Sources/CovalentIOS
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
    info:
      path: Config/CovalentIOS-Info.plist
      properties:
        CFBundleDisplayName: Covalent
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: Copyright © 2026 The Kozu Group
        NSLocalNetworkUsageDescription: Covalent finds backup devices you choose to pair on your local network.
        NSBonjourServices:
          - _covalent._udp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIDesignRequiresCompatibility: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportsDocumentBrowser: false
        BGTaskSchedulerPermittedIdentifiers:
          - life.michaelwong.covalent.ios.transfer-continuation
        UIBackgroundModes:
          - processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.michaelwong.covalent.ios
        PRODUCT_NAME: Covalent
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: true
      testTargets:
        - CovalentIOSUITests
  CovalentMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/CovalentMacUITests
    dependencies:
      - target: CovalentMac
    info:
      path: Config/CovalentMacUITests-Info.plist
      properties:
        CovalentUITestPort: $(COVALENT_UI_TEST_PORT)
        CovalentUITestToken: $(COVALENT_UI_TEST_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.michaelwong.covalent.macos-uitests
        TEST_TARGET_NAME: CovalentMac
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
  CovalentIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CovalentIOSUITests
    dependencies:
      - target: CovalentIOS
    info:
      path: Config/CovalentIOSUITests-Info.plist
      properties:
        CovalentUITestPort: $(COVALENT_UI_TEST_PORT)
        CovalentUITestToken: $(COVALENT_UI_TEST_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.michaelwong.covalent.ios-uitests
        TEST_TARGET_NAME: CovalentIOS
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
