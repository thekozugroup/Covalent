name: Covalent
options:
  bundleIdPrefix: life.michaelwong.covalent
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
targets:
  CovalentMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/CovalentShared
      - path: Sources/CovalentMac
    info:
      path: Config/CovalentMac-Info.plist
      properties:
        CFBundleDisplayName: Covalent
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: Copyright © 2026 The Kozu Group
        NSLocalNetworkUsageDescription: Covalent finds backup devices you choose to pair on your local network.
        NSBonjourServices:
          - _covalent._udp
    entitlements:
      path: Config/CovalentMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.michaelwong.covalent.macos
        PRODUCT_NAME: Covalent
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: true
  CovalentIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/CovalentShared
      - path: Sources/CovalentIOS
    info:
      path: Config/CovalentIOS-Info.plist
      properties:
        CFBundleDisplayName: Covalent
        NSHumanReadableCopyright: Copyright © 2026 The Kozu Group
        NSLocalNetworkUsageDescription: Covalent finds backup devices you choose to pair on your local network.
        NSBonjourServices:
          - _covalent._udp
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.michaelwong.covalent.ios
        PRODUCT_NAME: Covalent
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: true
