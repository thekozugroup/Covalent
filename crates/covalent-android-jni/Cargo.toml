[package]
name = "covalent-android-jni"
description = "Bounded Android JNI lifecycle bridge for an embedded Covalent node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Built as a staticlib; scripts/build-android-jni.sh performs the final link
# into libcovalent_android_jni.so so that the export surface is governed by
# exports.map.  A cdylib cannot honour that contract: rustc emits its own
# version script and marks every `#[no_mangle]` symbol in the whole crate
# graph global in it.  See scripts/build-android-jni.sh for the full rationale.
crate-type = ["staticlib"]

[dependencies]
anyhow.workspace = true
covalent-core = { version = "0.1.0", path = "../covalent-core" }
# default-features = false drops `covalent-node/cli` (clap +
# tracing-subscriber/env-filter).  See crates/covalent-node/Cargo.toml.
covalent-node = { version = "0.1.0", path = "../covalent-node", default-features = false }
covalent-protocol = { version = "0.1.0", path = "../covalent-protocol" }
jni.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
zeroize.workspace = true

# JNI load and native-method registration require narrowly documented FFI calls.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
