openapi: 3.1.0
info:
  title: Covalent local node API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
  description: >-
    Versioned API for a locally controlled Covalent node. Except for health and
    coarse status, every route requires the bearer token stored in the node data
    directory. Remote storage peers use the separately authenticated QUIC protocol.
servers:
  - url: http://127.0.0.1:8787
security:
  - localToken: []
paths:
  /healthz:
    get:
      summary: Check node process readiness
      operationId: health
      security: []
      responses:
        "200":
          description: Node process is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "405":
          $ref: "#/components/responses/ClientError"
  /api/v1/status:
    get:
      summary: Read coarse public node status
      operationId: status
      security: []
      responses:
        "200":
          description: Coarse non-secret node status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "405":
          $ref: "#/components/responses/ClientError"
  /api/v1/transport/identity:
    get:
      summary: Read the authenticated transport identity
      operationId: transportIdentity
      responses:
        "200":
          description: Public identity and certificate used for an explicitly confirmed provider connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransportIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/discovery:
    get:
      summary: List untrusted discovery candidates
      operationId: discoveryCandidates
      responses:
        "200":
          description: Untrusted LAN and Tailscale reachability hints. An empty list is valid when discovery is disabled.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1024
                items:
                  $ref: "#/components/schemas/DiscoveryCandidate"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/config/export:
    post:
      summary: Export non-secret device settings
      operationId: exportConfig
      responses:
        "200":
          description: Export-safe settings without identity keys, backup keys, grants, or provider credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportedSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/config/import:
    post:
      summary: Import explicitly confirmed safe settings
      operationId: importConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmed, settings]
              properties:
                confirmed:
                  type: boolean
                settings:
                  $ref: "#/components/schemas/ExportedSettings"
      responses:
        "204":
          description: Safe settings replaced after explicit confirmation.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/pair/invitations:
    post:
      summary: Create a signed pairing invitation
      operationId: createPairingInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lifetimeMs, endpoints]
              properties:
                lifetimeMs:
                  type: integer
                  minimum: 1
                  maximum: 900000
                endpoints:
                  type: array
                  maxItems: 16
                  items:
                    type: string
                    minLength: 1
                    maxLength: 512
      responses:
        "200":
          description: Signed, expiring, single-use invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/pair/network/start:
    post:
      summary: Start network pairing with a discovered candidate
      operationId: startNetworkPairing
      description: >-
        Originates a QUIC pairing exchange against one discovered candidate
        endpoint. The candidate is resolved with bounded DNS and must land on a
        private, loopback, link-local, or tailnet route; a public route is
        refused rather than dialled. Each resolved address is tried in turn over
        the pairing-only ALPN, and the certificate observed on that exact dial
        must match the transport binding inside the peer's signed invitation, so
        an invitation replayed from a different endpoint or identity is rejected
        before anything is retained. The returned request is awaiting local
        confirmation on both devices and carries the short authentication string
        a human compares; nothing is authorized until both devices confirm it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidateAddress]
              properties:
                candidateAddress:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: >-
                    Host and port of the discovered candidate, as carried by a
                    DiscoveryCandidate endpoint.
      responses:
        "200":
          description: >-
            Retained outgoing request awaiting local confirmation, carrying the
            short authentication string to compare against the peer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPairingItem"
        "400":
          description: >-
            The body does not satisfy the versioned contract, the candidate does
            not resolve to a safe route, or this node has no concrete advertised
            peer endpoint to pair with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            The peer's signed invitation did not verify against the identity or
            certificate observed on the dial.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: >-
            The devices do not share a supported pairing wire version, or the
            peer refused the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: >-
            The peer's transport binding failed authenticated verification
            against the observed certificate fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: >-
            No resolved address answered the pairing request. This is retryable
            once the selected device is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/pair/network/pending:
    get:
      summary: List retained network pairing requests
      operationId: listNetworkPairingRequests
      description: >-
        Lists every retained QUIC pairing request, incoming and outgoing, after
        applying expiry transitions. Completed and failed requests are retained
        until they are explicitly cancelled so a polling client cannot miss a
        terminal outcome. The view carries no invitation secret and no signed
        exchange material.
      responses:
        "200":
          description: Secret-free view of every retained pairing request.
          content:
            application/json:
              schema:
                type: array
                maxItems: 64
                items:
                  $ref: "#/components/schemas/NetworkPairingItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pair/network/{pairingId}/confirm:
    post:
      summary: Confirm a network pairing request with the displayed code
      operationId: confirmNetworkPairing
      description: >-
        Records this device's explicit short authentication string approval for
        one retained QUIC pairing request and signs the updated exchange. When
        both devices have confirmed, the pairing is finalized and the mutually
        confirmed transport binding is connected as a pinned provider. The
        displayed code is compared against the exchange in constant application
        logic; a mismatch is an identity failure, not a retryable error.
      parameters:
        - name: pairingId
          in: path
          required: true
          description: Invitation identifier naming the retained pairing request.
          schema:
            $ref: "#/components/schemas/NetworkPairingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [displayedCode]
              properties:
                displayedCode:
                  type: string
                  pattern: "^[0-9]{4}(-[0-9]{4}){3}$"
                  description: Code shown on this device and compared by a human against the peer.
      responses:
        "200":
          description: Updated secret-free pairing item after this device's confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkPairingItem"
        "400":
          description: >-
            The body does not satisfy the versioned contract, or the request is
            already complete or failed and is no longer confirmable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The displayed code does not match the exchange's short authentication string.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: >-
            The finalized peer transport binding failed authenticated
            verification against the observed certificate fingerprint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pair/network/{pairingId}:
    delete:
      summary: Cancel and forget a network pairing request
      operationId: cancelNetworkPairing
      description: >-
        Removes one retained pairing request. An incoming request that has not
        completed also consumes its underlying invitation, so a cancelled
        invitation can never be reused.
      parameters:
        - name: pairingId
          in: path
          required: true
          description: Invitation identifier naming the retained pairing request.
          schema:
            $ref: "#/components/schemas/NetworkPairingId"
      responses:
        "204":
          description: The pairing request was removed. No response body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/pair/accept:
    post:
      summary: Accept a pairing invitation as responder
      operationId: acceptPairingInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairAcceptRequest"
      responses:
        "200":
          description: Signed role-bound session containing the comparison code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/pair/confirm/responder:
    post:
      summary: Confirm the responder comparison code
      operationId: confirmPairingResponder
      requestBody:
        $ref: "#/components/requestBodies/PairConfirmation"
      responses:
        "200":
          $ref: "#/components/responses/PairingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/pair/confirm/inviter:
    post:
      summary: Confirm the inviter comparison code
      operationId: confirmPairingInviter
      requestBody:
        $ref: "#/components/requestBodies/PairConfirmation"
      responses:
        "200":
          $ref: "#/components/responses/PairingSession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/pair/finalize/responder:
    post:
      summary: Finalize pairing as responder
      operationId: finalizePairingResponder
      requestBody:
        $ref: "#/components/requestBodies/PairFinalization"
      responses:
        "200":
          $ref: "#/components/responses/PairingConfirmation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/pair/finalize/inviter:
    post:
      summary: Finalize pairing as inviter
      operationId: finalizePairingInviter
      requestBody:
        $ref: "#/components/requestBodies/PairFinalization"
      responses:
        "200":
          $ref: "#/components/responses/PairingConfirmation"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/peers/revoke:
    post:
      summary: Revoke a paired peer
      operationId: revokePeer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [peerId]
              properties:
                peerId:
                  $ref: "#/components/schemas/DeviceId"
      responses:
        "204":
          description: Revocation tombstone committed and provider disconnected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/providers:
    get:
      summary: List explicitly connected providers
      operationId: listProviders
      responses:
        "200":
          description: Explicitly connected provider endpoints and public certificate fingerprints.
          content:
            application/json:
              schema:
                type: array
                maxItems: 128
                items:
                  $ref: "#/components/schemas/ProviderConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/providers/connect:
    post:
      summary: Connect an authorized pinned provider
      operationId: connectProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [peerId, address, certificateDer]
              properties:
                peerId:
                  $ref: "#/components/schemas/DeviceId"
                address:
                  type: string
                  description: Numeric socket address, including port.
                certificateDer:
                  type: string
                  maxLength: 131072
                  description: Base64url DER certificate transferred through the confirmed pairing channel.
      responses:
        "200":
          description: Provider connection persisted after role and certificate validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderConnection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/providers/disconnect:
    post:
      summary: Disconnect a remembered provider
      operationId: disconnectProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [peerId]
              properties:
                peerId:
                  $ref: "#/components/schemas/DeviceId"
      responses:
        "204":
          description: Provider endpoint disconnected without revoking trust.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/rosters/current:
    get:
      summary: Read the current signed peer roster
      operationId: currentRoster
      responses:
        "200":
          description: Latest locally signed roster, or null before the first peer grant.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SignedRoster"
                  - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/rosters/accept:
    post:
      summary: Accept a non-rollback signed roster
      operationId: acceptRoster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignedRoster"
      responses:
        "200":
          description: Advanced anti-rollback cursor. Roster gossip never grants trust automatically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RosterCursor"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/jobs:
    get:
      summary: List active and resumable jobs
      operationId: listJobs
      responses:
        "200":
          description: Bounded registry after TTL/LRU pruning.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1024
                items:
                  $ref: "#/components/schemas/JobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/jobs/control:
    post:
      summary: Pause, resume, or cancel an active job
      operationId: controlJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jobId, action]
              properties:
                jobId:
                  $ref: "#/components/schemas/JobId"
                action:
                  enum: [pause, resume, cancel]
      responses:
        "200":
          description: Current in-process job signal state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ClientError"
  /api/v1/jobs/discard:
    post:
      summary: Discard an inactive resumable job and its private artifacts
      operationId: discardJob
      requestBody:
        $ref: "#/components/requestBodies/JobReference"
      responses:
        "204":
          description: Inactive job, checkpoint, restore plans, and staging removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/jobs/acknowledge:
    post:
      summary: Acknowledge a fully received archive result
      operationId: acknowledgeJob
      requestBody:
        $ref: "#/components/requestBodies/JobReference"
      responses:
        "204":
          description: Retained byte-identical archive result and private staging removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/backups:
    get:
      summary: List authoritative remembered backups
      operationId: listBackups
      responses:
        "200":
          description: Authoritative remembered backups and validated latest local snapshot metadata.
          content:
            application/json:
              schema:
                type: array
                maxItems: 100000
                items:
                  $ref: "#/components/schemas/BackupSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Create a backup from a daemon-visible path
      operationId: createBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupRequest"
      responses:
        "200":
          description: Locally committed encrypted backup and exact explicit replication outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/backups/archive:
    post:
      summary: Create a backup from a streamed platform archive
      operationId: createBackupFromArchive
      description: >-
        Streams a ZIP assembled from platform-owned file access. Android SAF
        content URIs and Apple security-scoped paths remain local to their app
        and must never appear in this request or in sourceRoot.
      parameters:
        - in: header
          name: X-Covalent-Archive-Metadata
          required: true
          description: Base64url canonical ArchiveBackupMetadata JSON, at most 32 KiB decoded.
          schema:
            type: string
            maxLength: 65536
            contentEncoding: base64url
            contentMediaType: application/json
            contentSchema:
              $ref: "#/components/schemas/ArchiveBackupMetadata"
      requestBody:
        required: true
        content:
          application/vnd.covalent.backup+zip:
            schema:
              type: string
              format: binary
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Streamed archive was safely staged, encrypted, committed, explicitly replicated, and retained byte-identically until acknowledgement.
          headers:
            X-Covalent-Job-Ack-Required:
              required: true
              schema:
                type: string
                const: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupResponse"
        "400":
          description: Metadata or a ZIP entry violated the versioned archive contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/v1/backups/verify:
    post:
      summary: Verify and optionally repair a backup
      operationId: verifyBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        "200":
          description: Authenticated local integrity and optional explicit-provider availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/restores/preview:
    post:
      summary: Preview a root-confined restore
      operationId: previewRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestorePreviewRequest"
      responses:
        "200":
          description: Durable signed no-write plan reference. Entries are read through the bounded paginated route.
          headers:
            X-Covalent-Restore-Plan-Id:
              $ref: "#/components/headers/RestorePlanId"
            X-Covalent-Restore-Plan-Digest:
              $ref: "#/components/headers/RestorePlanDigest"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePlanReference"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/restores/plans/{planId}:
    get:
      summary: Read a bounded page of a durable signed restore plan
      operationId: getRestorePlanPage
      parameters:
        - name: planId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/HexDigest"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            pattern: "^[0-9]+$"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: One page bound to the same immutable signed plan reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePlanPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/ClientError"
  /api/v1/restores/execute:
    post:
      summary: Execute an immutable signed restore plan
      operationId: executeRestore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreExecuteRequest"
      responses:
        "200":
          description: Atomic restore result for the exact signed plan.
          headers:
            X-Covalent-Restore-Plan-Id:
              $ref: "#/components/headers/RestorePlanId"
            X-Covalent-Restore-Plan-Digest:
              $ref: "#/components/headers/RestorePlanDigest"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/restores/archive/inventories:
    post:
      summary: Begin a bounded client target inventory upload
      operationId: beginTargetInventory
      description: >-
        Opens a resumable upload session for the client-observed target
        inventory of a document-provider restore. The declared root identity,
        entry count, and total byte count are immutable for the life of the
        session. Entries are appended as ordered pages and the session is sealed
        by finalize.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BeginTargetInventoryRequest"
      responses:
        "200":
          description: Opened upload session and the next expected entry offset, which is always zero.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetInventoryUploadResponse"
        "400":
          description: >-
            The job ID is invalid, or the declared inventory metadata is invalid
            or exceeds its bounded contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/restores/archive/inventories/{inventoryId}/pages:
    post:
      summary: Append one ordered page to a target inventory upload
      operationId: appendTargetInventoryPage
      description: >-
        Appends the next contiguous page of strictly path-sorted entries. Pages
        are idempotent: re-sending a page that is already durable at its
        original offset returns the current durable offset instead of storing it
        twice. Any other offset mismatch is rejected with the durable offset in
        X-Covalent-Inventory-Offset so the client can resume exactly.
      parameters:
        - name: inventoryId
          in: path
          required: true
          description: Upload session identifier returned when the inventory was begun.
          schema:
            $ref: "#/components/schemas/HexDigest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TargetInventoryPageRequest"
      responses:
        "200":
          description: Page is durable. Returns the next expected entry offset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetInventoryUploadResponse"
        "400":
          description: >-
            The upload identity is malformed, or the entries are not canonical,
            sorted, unique, and within the immutable declared counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The upload is bound to a different restore job, or the page offset
            does not match the durable server offset.
          headers:
            X-Covalent-Inventory-Offset:
              $ref: "#/components/headers/TargetInventoryOffset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The page is empty or its content does not match its declared page digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
  /api/v1/restores/archive/inventories/{inventoryId}/finalize:
    post:
      summary: Seal a target inventory upload
      operationId: finalizeTargetInventory
      description: >-
        Verifies that every declared entry was uploaded, computes the canonical
        BLAKE3 inventory digest over the sorted entries, and writes the sealed
        inventory. The call is idempotent: once sealed, the same reference is
        returned and the staging session and page file no longer exist. A
        declared final digest that does not match discards the staged upload.
      parameters:
        - name: inventoryId
          in: path
          required: true
          description: Upload session identifier returned when the inventory was begun.
          schema:
            $ref: "#/components/schemas/HexDigest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeTargetInventoryRequest"
      responses:
        "200":
          description: Sealed inventory reference usable by streamed archive restore preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetInventoryReference"
        "400":
          description: >-
            The upload identity is malformed, or the staged entries are not
            canonical, sorted, unique, and within the declared counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The finalization does not match the immutable upload metadata, or
            the uploaded pages are incomplete.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: The staged content does not match the declared final inventory digest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/restores/archive/preview:
    post:
      summary: Preview a streamed document-provider restore
      operationId: previewArchiveRestore
      description: Creates a signed no-write create-only plan in a daemon-owned private staging root for an empty client-authorized destination.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreArchivePreviewRequest"
      responses:
        "200":
          description: Durable signed immutable content reference for subsequent paginated review and streamed execution.
          headers:
            X-Covalent-Restore-Plan-Id:
              $ref: "#/components/headers/RestorePlanId"
            X-Covalent-Restore-Plan-Digest:
              $ref: "#/components/headers/RestorePlanDigest"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePlanReference"
        "400":
          description: Streamed restore policy is not fail-on-conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/restores/archive/execute:
    post:
      summary: Execute and stream a document-provider restore
      operationId: executeArchiveRestore
      description: >-
        Executes only a create-only archive restore plan for an empty
        destination, then streams a ZIP. Android writes through authorized SAF
        descriptors; Apple writes while security-scoped folder access is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreExecuteRequest"
      responses:
        "200":
          description: ZIP stream with a base64url RestoreResponse in X-Covalent-Restore-Result.
          headers:
            X-Covalent-Restore-Result:
              required: true
              schema:
                type: string
            X-Covalent-Restore-Plan-Id:
              $ref: "#/components/headers/RestorePlanId"
            X-Covalent-Restore-Plan-Digest:
              $ref: "#/components/headers/RestorePlanDigest"
            X-Covalent-Job-Ack-Required:
              required: true
              schema:
                type: string
                const: "true"
          content:
            application/vnd.covalent.restore+zip:
              schema:
                type: string
                format: binary
        "400":
          description: Plan is not an archive restore plan or does not match its private staging root.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    localToken:
      type: http
      scheme: bearer
      bearerFormat: random-256-bit-local-token
  headers:
    RestorePlanId:
      required: true
      description: Durable opaque identifier for the persisted immutable plan.
      schema:
        $ref: "#/components/schemas/HexDigest"
    RestorePlanDigest:
      required: true
      description: Digest bound by the signed restore plan.
      schema:
        $ref: "#/components/schemas/HexDigest"
    TargetInventoryOffset:
      required: true
      description: Durable server-side entry offset to resume a target inventory upload from.
      schema:
        type: integer
        minimum: 0
  requestBodies:
    PairConfirmation:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [session, displayedCode]
            properties:
              session:
                $ref: "#/components/schemas/PairingSession"
              displayedCode:
                type: string
                pattern: "^[0-9]{4}(-[0-9]{4}){3}$"
    PairFinalization:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [session]
            properties:
              session:
                $ref: "#/components/schemas/PairingSession"
    JobReference:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [jobId]
            properties:
              jobId:
                $ref: "#/components/schemas/JobId"
  responses:
    ClientError:
      description: The route or HTTP method is not available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing or invalid local bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Peer is unknown, revoked, or lacks the required role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Confirmation, resume, or restore conflict requires local action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unavailable:
      description: No intact authorized copy is currently available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PayloadTooLarge:
      description: A bounded request, archive, or expanded entry set exceeded its contract limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The referenced upload session or restore job is unavailable, expired, or already finalized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Gone:
      description: The pairing request or its invitation is invalid, expired, or already used.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: "JSON routes require Content-Type: application/json."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InsufficientStorage:
      description: The bounded archive staging budget or the reserved free-space floor is exhausted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: The local node could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PairingSession:
      description: Updated signed pairing exchange.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PairingSession"
    PairingConfirmation:
      description: Both role-scoped grants after mutual confirmation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PairingConfirmation"
  schemas:
    DeviceId:
      type: string
      format: uuid
    BackupId:
      type: string
      format: uuid
    SnapshotId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"
    JobId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"
    JobStatus:
      type: object
      additionalProperties: false
      required: [jobId, state, active, lastTouchedUnixMs]
      properties:
        jobId:
          $ref: "#/components/schemas/JobId"
        state:
          enum: [running, paused, cancelled]
        active:
          type: boolean
        lastTouchedUnixMs:
          type: integer
          minimum: 0
    Role:
      enum: [storage_provider, backup_reader, backup_writer]
    Health:
      type: object
      additionalProperties: false
      required: [status, protocolVersion]
      properties:
        status:
          const: ok
        protocolVersion:
          const: 1
    Status:
      type: object
      additionalProperties: false
      required: [deviceName, protocolVersion, lanDiscovery, platformTier, state]
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
        protocolVersion:
          const: 1
        lanDiscovery:
          type: boolean
        platformTier:
          enum: [tier1, tier2]
        state:
          const: ready
    TransportIdentity:
      type: object
      additionalProperties: false
      required: [deviceId, peerPort, certificateDer, certificateFingerprint]
      properties:
        deviceId:
          $ref: "#/components/schemas/DeviceId"
        peerPort:
          type: integer
          minimum: 1
          maximum: 65535
        certificateDer:
          type: string
        certificateFingerprint:
          $ref: "#/components/schemas/HexDigest"
    DiscoveryCandidate:
      type: object
      additionalProperties: false
      required: [source, endpoint, serviceId, minimumProtocolVersion, maximumProtocolVersion]
      properties:
        source:
          enum: [lan_mdns, tailscale]
        endpoint:
          type: string
        serviceId:
          type: string
        minimumProtocolVersion:
          type: integer
          minimum: 1
        maximumProtocolVersion:
          type: integer
          minimum: 1
    RememberedBackup:
      type: object
      additionalProperties: false
      required: [backupId, name, ownerDeviceId]
      properties:
        backupId:
          $ref: "#/components/schemas/BackupId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        ownerDeviceId:
          $ref: "#/components/schemas/DeviceId"
    ExportedSettings:
      type: object
      additionalProperties: false
      required: [schemaVersion, deviceName, lanDiscoveryEnabled, rememberedBackups]
      properties:
        schemaVersion:
          const: 1
        deviceName:
          type: string
          minLength: 1
          maxLength: 80
        lanDiscoveryEnabled:
          type: boolean
        rememberedBackups:
          type: array
          maxItems: 100000
          items:
            $ref: "#/components/schemas/RememberedBackup"
    PairingInvitation:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - minimumProtocolVersion
        - inviterDeviceId
        - inviterPublicKey
        - inviterDeviceName
        - invitationId
        - invitationSecret
        - invitationSecretCommitment
        - expiresAtUnixMs
        - endpoints
        - signature
      properties:
        protocolVersion:
          const: 1
        minimumProtocolVersion:
          const: 1
        inviterDeviceId:
          $ref: "#/components/schemas/DeviceId"
        inviterPublicKey:
          type: string
        inviterDeviceName:
          type: string
          minLength: 1
          maxLength: 80
        invitationId:
          type: string
          maxLength: 128
        invitationSecret:
          type: string
        invitationSecretCommitment:
          $ref: "#/components/schemas/HexDigest"
        expiresAtUnixMs:
          type: integer
          minimum: 1
        endpoints:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 512
        signature:
          type: string
    PairAcceptRequest:
      type: object
      additionalProperties: false
      required: [invitation, responderName]
      properties:
        invitation:
          $ref: "#/components/schemas/PairingInvitation"
        responderName:
          type: string
          minLength: 1
          maxLength: 80
        responderRoles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        inviterRoles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
    PairingSession:
      type: object
      description: Strict serialized role-bound exchange. Fields are signed; clients must round-trip them unchanged.
      additionalProperties: false
      required:
        - invitation
        - responderDeviceId
        - responderPublicKey
        - responderName
        - responderRoles
        - inviterRoles
        - authenticationString
        - responderAcceptanceSignature
        - responderConfirmationSignature
        - inviterConfirmationSignature
      properties:
        invitation:
          $ref: "#/components/schemas/PairingInvitation"
        responderDeviceId:
          $ref: "#/components/schemas/DeviceId"
        responderPublicKey:
          type: string
        responderName:
          type: string
        responderRoles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        inviterRoles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        authenticationString:
          type: string
        responderAcceptanceSignature:
          type: string
        responderConfirmationSignature:
          type: [string, "null"]
        inviterConfirmationSignature:
          type: [string, "null"]
    PeerGrant:
      type: object
      additionalProperties: false
      required: [peerDeviceId, publicKey, displayName, roles, confirmedAtUnixMs, revoked]
      properties:
        peerDeviceId:
          $ref: "#/components/schemas/DeviceId"
        publicKey:
          type: string
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        confirmedAtUnixMs:
          type: integer
          minimum: 0
        revoked:
          type: boolean
    PairingConfirmation:
      type: object
      additionalProperties: false
      required: [inviterGrant, responderGrant]
      properties:
        inviterGrant:
          $ref: "#/components/schemas/PeerGrant"
        responderGrant:
          $ref: "#/components/schemas/PeerGrant"
    ProviderConnection:
      type: object
      additionalProperties: false
      required: [peerId, address, certificateFingerprint]
      properties:
        peerId:
          $ref: "#/components/schemas/DeviceId"
        address:
          type: string
        certificateFingerprint:
          $ref: "#/components/schemas/HexDigest"
    SignedRoster:
      type: object
      additionalProperties: false
      required: [protocolVersion, epoch, previousDigest, grants, signerDeviceId, signature]
      properties:
        protocolVersion:
          const: 1
        epoch:
          type: integer
          minimum: 1
        previousDigest:
          type: string
        grants:
          type: array
          maxItems: 128
          items:
            $ref: "#/components/schemas/PeerGrant"
        signerDeviceId:
          $ref: "#/components/schemas/DeviceId"
        signature:
          type: string
    RosterCursor:
      type: object
      additionalProperties: false
      required: [epoch, digest]
      properties:
        epoch:
          type: integer
          minimum: 1
        digest:
          $ref: "#/components/schemas/HexDigest"
    BackupRequest:
      type: object
      additionalProperties: false
      required: [sourceRoot, displayName, snapshotId, jobId]
      properties:
        sourceRoot:
          type: string
        backupId:
          oneOf:
            - $ref: "#/components/schemas/BackupId"
            - type: "null"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        jobId:
          $ref: "#/components/schemas/JobId"
        selectedProviderIds:
          type: array
          maxItems: 128
          uniqueItems: true
          description: Exact explicit set. Omitted or empty means local-only; the node never adds peers.
          items:
            $ref: "#/components/schemas/DeviceId"
    ArchiveBackupMetadata:
      type: object
      additionalProperties: false
      required: [protocolVersion, displayName, snapshotId, jobId]
      properties:
        protocolVersion:
          type: integer
          const: 1
        backupId:
          oneOf:
            - $ref: "#/components/schemas/BackupId"
            - type: "null"
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        jobId:
          $ref: "#/components/schemas/JobId"
        selectedProviderIds:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceId"
    BackupSummary:
      type: object
      additionalProperties: false
      required: [backupId, name, ownerDeviceId, latestSnapshotId, latestCommittedAtUnixMs, snapshotCount, selectedProviderIds]
      properties:
        backupId:
          $ref: "#/components/schemas/BackupId"
        name:
          type: string
          minLength: 1
          maxLength: 120
        ownerDeviceId:
          $ref: "#/components/schemas/DeviceId"
        latestSnapshotId:
          oneOf:
            - $ref: "#/components/schemas/SnapshotId"
            - type: "null"
        latestCommittedAtUnixMs:
          type: [integer, "null"]
          minimum: 0
        snapshotCount:
          type: integer
          minimum: 0
        selectedProviderIds:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DeviceId"
    BackupResponse:
      type: object
      additionalProperties: false
      required:
        - backupId
        - snapshotId
        - entries
        - bytesRead
        - chunksStored
        - chunksDeduplicated
        - selectedProviders
        - degradedFailures
      properties:
        backupId:
          $ref: "#/components/schemas/BackupId"
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        entries:
          type: integer
          minimum: 0
        bytesRead:
          type: integer
          minimum: 0
        chunksStored:
          type: integer
          minimum: 0
        chunksDeduplicated:
          type: integer
          minimum: 0
        selectedProviders:
          type: integer
          minimum: 0
        degradedFailures:
          type: integer
          minimum: 0
    SnapshotRequest:
      type: object
      additionalProperties: false
      required: [backupId, snapshotId]
      properties:
        backupId:
          $ref: "#/components/schemas/BackupId"
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        verifyProviders:
          type: boolean
          default: false
        repair:
          type: boolean
          default: false
    VerifyResponse:
      type: object
      additionalProperties: false
      required: [verified, missing, corrupt, intact, providerAvailability]
      properties:
        verified:
          type: integer
          minimum: 0
        missing:
          type: array
          items:
            $ref: "#/components/schemas/HexDigest"
        corrupt:
          type: array
          items:
            $ref: "#/components/schemas/HexDigest"
        intact:
          type: boolean
        providerAvailability:
          type: object
          additionalProperties:
            enum: [complete, degraded, offline, corrupt, revoked]
    RestorePreviewRequest:
      type: object
      additionalProperties: false
      required: [backupId, snapshotId, targetRoot, conflictPolicy, jobId]
      properties:
        backupId:
          $ref: "#/components/schemas/BackupId"
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        targetRoot:
          type: string
        conflictPolicy:
          enum: [fail, skip, replace, rename]
        jobId:
          $ref: "#/components/schemas/JobId"
    RestoreArchivePreviewRequest:
      type: object
      additionalProperties: false
      required: [backupId, snapshotId, conflictPolicy, jobId]
      properties:
        backupId:
          $ref: "#/components/schemas/BackupId"
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        conflictPolicy:
          enum: [fail]
          description: Streamed restore destinations must be empty so every signed action is a create.
        jobId:
          $ref: "#/components/schemas/JobId"
    RestorePreviewEntry:
      type: object
      additionalProperties: false
      required: [sourcePath, destinationPath, kind, action]
      properties:
        sourcePath:
          type: string
        destinationPath:
          type: string
        kind:
          enum: [file, directory]
        action:
          enum: [create_file, create_directory, keep_directory, skip_file, replace_file, rename_file]
    RestorePlanReference:
      type: object
      additionalProperties: false
      required:
        - planId
        - backupId
        - snapshotId
        - authorizedRoot
        - manifestDigest
        - conflictPolicy
        - jobId
        - planDigest
        - signerDeviceId
        - signature
        - totalEntries
      properties:
        planId:
          $ref: "#/components/schemas/HexDigest"
        backupId:
          $ref: "#/components/schemas/BackupId"
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        authorizedRoot:
          type: string
        manifestDigest:
          $ref: "#/components/schemas/HexDigest"
        conflictPolicy:
          enum: [fail, skip, replace, rename]
        jobId:
          $ref: "#/components/schemas/JobId"
        planDigest:
          $ref: "#/components/schemas/HexDigest"
        signerDeviceId:
          $ref: "#/components/schemas/DeviceId"
        signature:
          type: string
        totalEntries:
          type: integer
          minimum: 0
          maximum: 1000000
    RestorePlanPage:
      type: object
      additionalProperties: false
      required:
        - planId
        - backupId
        - snapshotId
        - authorizedRoot
        - manifestDigest
        - conflictPolicy
        - jobId
        - planDigest
        - signerDeviceId
        - signature
        - entryOffset
        - totalEntries
        - entries
        - nextCursor
      properties:
        planId:
          $ref: "#/components/schemas/HexDigest"
        backupId:
          $ref: "#/components/schemas/BackupId"
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        authorizedRoot:
          type: string
        manifestDigest:
          $ref: "#/components/schemas/HexDigest"
        conflictPolicy:
          enum: [fail, skip, replace, rename]
        jobId:
          $ref: "#/components/schemas/JobId"
        planDigest:
          $ref: "#/components/schemas/HexDigest"
        signerDeviceId:
          $ref: "#/components/schemas/DeviceId"
        signature:
          type: string
        entryOffset:
          type: integer
          minimum: 0
        totalEntries:
          type: integer
          minimum: 0
          maximum: 1000000
        entries:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/RestorePreviewEntry"
        nextCursor:
          oneOf:
            - type: string
              pattern: "^[0-9]+$"
            - type: "null"
    RestoreExecuteRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [planId]
          properties:
            planId:
              $ref: "#/components/schemas/HexDigest"
        - type: object
          additionalProperties: false
          required: [plan]
          properties:
            plan:
              $ref: "#/components/schemas/LegacyRestorePlan"
      description: Execute by durable plan ID. The full-plan form remains only for protocol-v1 compatibility and is persisted before execution.
    LegacyRestorePlan:
      type: object
      additionalProperties: false
      required:
        - backupId
        - snapshotId
        - authorizedRoot
        - rootDevice
        - rootInode
        - manifestDigest
        - conflictPolicy
        - jobId
        - entries
        - planDigest
        - signerDeviceId
        - signature
      properties:
        backupId:
          $ref: "#/components/schemas/BackupId"
        snapshotId:
          $ref: "#/components/schemas/SnapshotId"
        authorizedRoot:
          type: string
        rootDevice:
          type: integer
          minimum: 0
        rootInode:
          type: integer
          minimum: 0
        manifestDigest:
          $ref: "#/components/schemas/HexDigest"
        conflictPolicy:
          enum: [fail, skip, replace, rename]
        jobId:
          $ref: "#/components/schemas/JobId"
        entries:
          type: array
          maxItems: 1000000
          items:
            $ref: "#/components/schemas/RestorePreviewEntry"
        planDigest:
          $ref: "#/components/schemas/HexDigest"
        signerDeviceId:
          $ref: "#/components/schemas/DeviceId"
        signature:
          type: string
    RestoreResponse:
      type: object
      additionalProperties: false
      required: [filesRestored, directoriesCreated, filesSkipped, bytesWritten, rejectedProviderCopies]
      properties:
        filesRestored:
          type: integer
          minimum: 0
        directoriesCreated:
          type: integer
          minimum: 0
        filesSkipped:
          type: integer
          minimum: 0
        bytesWritten:
          type: integer
          minimum: 0
        rejectedProviderCopies:
          type: integer
          minimum: 0
    NetworkPairingId:
      type: string
      description: Invitation identifier that also names the retained network pairing request.
      minLength: 1
      maxLength: 128
    TransportBinding:
      type: object
      description: Transport endpoint and pinned TLS identity bound into a mutually confirmed pairing.
      additionalProperties: false
      required: [peerId, displayName, address, certificateDer, certificateFingerprint]
      properties:
        peerId:
          $ref: "#/components/schemas/DeviceId"
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        address:
          type: string
          description: Canonical numeric socket address including the peer port.
          maxLength: 512
        certificateDer:
          type: string
          description: Base64url unpadded DER certificate pinned by the QUIC client.
        certificateFingerprint:
          $ref: "#/components/schemas/HexDigest"
    NetworkPairingItem:
      type: object
      description: Secret-free view of one retained network pairing request.
      additionalProperties: false
      required:
        - pairingId
        - direction
        - peerName
        - authenticationString
        - expiresAtUnixMs
        - state
      properties:
        pairingId:
          $ref: "#/components/schemas/NetworkPairingId"
        direction:
          enum: [incoming, outgoing]
          description: Whether this device created the request or received it from a remote node.
        peerName:
          type: string
          minLength: 1
          maxLength: 80
        authenticationString:
          type: string
          pattern: "^[0-9]{4}(-[0-9]{4}){3}$"
          description: Short authentication string a human compares on both devices.
        expiresAtUnixMs:
          type: integer
          minimum: 1
        state:
          enum:
            - awaiting_local_confirmation
            - awaiting_peer_confirmation
            - complete
            - failed
        failureCode:
          type: string
          pattern: "^[a-z_]{1,80}$"
          description: Present only for a failed request.
        failureMessage:
          type: string
          minLength: 1
          maxLength: 256
          description: Present only for a failed request.
        peerTransport:
          $ref: "#/components/schemas/TransportBinding"
    TargetInventoryEntry:
      type: object
      description: One client-observed target entry used to compute external restore actions.
      additionalProperties: false
      required: [path, kind, length, identityToken]
      properties:
        path:
          type: string
          description: >-
            Normalized relative slash-separated path beneath the authorized SAF
            tree or PowerBox root. Absolute paths, backslashes, NUL, and empty,
            dot, or parent components are rejected.
          minLength: 1
          maxLength: 4096
        kind:
          enum: [file, directory]
        length:
          type: integer
          description: Observed regular-file length. Must be zero for a directory.
          minimum: 0
        modifiedAtUnixMs:
          type: integer
          minimum: 0
        identityToken:
          type: string
          description: Bounded provider identity token used to detect replacement before apply.
          minLength: 1
          maxLength: 512
    BeginTargetInventoryRequest:
      type: object
      additionalProperties: false
      required: [jobId, schemaVersion, rootIdentity, entryCount, totalBytes]
      properties:
        jobId:
          $ref: "#/components/schemas/JobId"
        schemaVersion:
          const: 1
        rootIdentity:
          type: string
          description: Stable client-owned identity for the authorized SAF tree or PowerBox root.
          minLength: 1
          maxLength: 512
        entryCount:
          type: integer
          minimum: 0
          maximum: 250000
        totalBytes:
          type: integer
          minimum: 0
    TargetInventoryUploadResponse:
      type: object
      additionalProperties: false
      required: [inventoryId, jobId, nextOffset]
      properties:
        inventoryId:
          $ref: "#/components/schemas/HexDigest"
        jobId:
          $ref: "#/components/schemas/JobId"
        nextOffset:
          type: integer
          description: Next entry offset the server expects.
          minimum: 0
    TargetInventoryPageRequest:
      type: object
      additionalProperties: false
      required: [jobId, offset, pageDigest, entries]
      properties:
        jobId:
          $ref: "#/components/schemas/JobId"
        offset:
          type: integer
          description: Entry offset this page starts at.
          minimum: 0
        pageDigest:
          $ref: "#/components/schemas/HexDigest"
        entries:
          type: array
          minItems: 1
          maxItems: 250000
          items:
            $ref: "#/components/schemas/TargetInventoryEntry"
    FinalizeTargetInventoryRequest:
      type: object
      additionalProperties: false
      required: [jobId, entryCount, totalBytes]
      properties:
        jobId:
          $ref: "#/components/schemas/JobId"
        entryCount:
          type: integer
          minimum: 0
          maximum: 250000
        totalBytes:
          type: integer
          minimum: 0
        inventoryDigest:
          type: string
          description: Optional canonical inventory digest. An empty string skips the client-side cross-check.
          pattern: "^$|^[0-9a-f]{64}$"
          default: ""
    TargetInventoryReference:
      type: object
      additionalProperties: false
      required:
        - inventoryId
        - jobId
        - schemaVersion
        - rootIdentity
        - entryCount
        - totalBytes
        - inventoryDigest
      properties:
        inventoryId:
          $ref: "#/components/schemas/HexDigest"
        jobId:
          $ref: "#/components/schemas/JobId"
        schemaVersion:
          const: 1
        rootIdentity:
          type: string
          minLength: 1
          maxLength: 512
        entryCount:
          type: integer
          minimum: 0
        totalBytes:
          type: integer
          minimum: 0
        inventoryDigest:
          $ref: "#/components/schemas/HexDigest"
    HexDigest:
      type: string
      pattern: "^[0-9a-f]{64}$"
    ApiError:
      type: object
      additionalProperties: false
      required: [protocolVersion, code, message, retryable]
      properties:
        protocolVersion:
          const: 1
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
