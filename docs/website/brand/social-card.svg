<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Covalent — Share a folder. Choose where it goes.</title>
  <desc id="description">Open-source one-way file sharing, powered by rclone. Two overlapping circles form the Covalent mark.</desc>
  <rect width="1200" height="630" fill="#fafafa"/>
  <g transform="translate(66 55) scale(.65)" fill="none" color="#475569">
    <path d="M44 11.215a24 24 0 0 1 0 41.57 24 24 0 0 1 0-41.57Z" fill="currentColor" opacity=".22"/>
    <g stroke="currentColor" stroke-width="3.5"><circle cx="32" cy="32" r="24"/><circle cx="56" cy="32" r="24"/></g>
  </g>
  <text x="142" y="87" fill="#27272a" font-family="Georgia,serif" font-size="34">Covalent</text>
  <text x="68" y="257" fill="#27272a" font-family="Georgia,serif" font-size="68" letter-spacing="-1.5">Share a folder.</text>
  <text x="68" y="336" fill="#27272a" font-family="Georgia,serif" font-size="68" letter-spacing="-1.5">Choose where it goes.</text>
  <text x="72" y="412" fill="#52525b" font-family="Arial,sans-serif" font-size="25">One source. Your devices. Clear choices.</text>
  <g transform="translate(856 170) scale(3.1)" fill="none" color="#475569">
    <path d="M44 11.215a24 24 0 0 1 0 41.57 24 24 0 0 1 0-41.57Z" fill="currentColor" opacity=".16"/>
    <g stroke="currentColor" stroke-width="1.1"><circle cx="32" cy="32" r="24"/><circle cx="56" cy="32" r="24"/></g>
  </g>
  <path d="M72 510H1128" stroke="#e4e4e7"/>
  <text x="72" y="563" fill="#475569" font-family="Arial,sans-serif" font-size="21">Open source · Powered by rclone</text>
  <text x="1128" y="563" text-anchor="end" fill="#52525b" font-family="Arial,sans-serif" font-size="21">Mac · Android · Docker · Unraid</text>
</svg>
