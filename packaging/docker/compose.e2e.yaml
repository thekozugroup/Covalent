name: covalent-e2e

# This file intentionally describes three independent nodes. The test harness
# performs the authenticated pairing exchange over their published local APIs.
#
# Every node sets COVALENT_ADVERTISED_PEER_ADDRESS explicitly, and the network
# below exists so those addresses can be written down ahead of time.
#
# Without it the nodes refuse to advertise anything and every pairing route
# answers 409 `peer_endpoint_unavailable`. That refusal is correct: the only
# non-loopback address a container on a bridge network can see is its own
# 172.16/12 bridge address, which is reachable from the host and from sibling
# containers and from nothing else - emphatically not from the phone a real
# user is holding. The node cannot tell those two situations apart, so it
# declines rather than publish an address that would resolve, accept a tap, and
# then time out.
#
# This stack is the situation the node cannot detect: the peers here *are*
# sibling containers on that same bridge, so the bridge address is exactly the
# right one to advertise. Saying so explicitly is the documented remedy an
# Unraid operator uses for the same reason, so the harness exercises the real
# override rather than a test-only escape hatch.
#
# The addresses are static because the node signs the advertised address into
# the pairing transcript, and the pairing invitation endpoint rejects any
# endpoint that does not match it. A DHCP address assigned at container start
# cannot be named in the environment that same container is started with.
services:
  node-a:
    image: ${COVALENT_IMAGE:-covalent:e2e}
    command: ["serve", "--api-token-file", "/run/secrets/covalent-api-token"]
    user: "65532:65532"
    read_only: true
    init: true
    environment:
      COVALENT_LISTEN: 127.0.0.1:8787
      COVALENT_PEER_LISTEN: 0.0.0.0:8787
      COVALENT_HTTPS_HOST: 127.0.0.1
      COVALENT_ADVERTISED_PEER_ADDRESS: 172.28.7.11:8787
      COVALENT_DATA_DIR: /data
      COVALENT_KEY_ENCRYPTION_KEY_FILE: /run/secrets/covalent-kek
      COVALENT_KEY_ENCRYPTION_KEY_VERSION: "1"
      COVALENT_DEVICE_NAME: Node A
      COVALENT_LAN_DISCOVERY: "false"
      UMASK: "027"
    ports: ["18781:8443/tcp", "18781:8787/udp"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - a-data:/data
      - a-config:/config
      - ./example/source:/source:ro
      - a-restore:/restore
      - type: bind
        source: ${COVALENT_E2E_KEK_A:?Set a distinct node A E2E KEK}
        target: /run/secrets/covalent-kek
        read_only: true
      - type: bind
        source: ${COVALENT_E2E_TOKEN_A:?Set a distinct node A E2E API token file}
        target: /run/secrets/covalent-api-token
        read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      peers:
        ipv4_address: 172.28.7.11
  node-b:
    image: ${COVALENT_IMAGE:-covalent:e2e}
    command: ["serve", "--api-token-file", "/run/secrets/covalent-api-token"]
    user: "65532:65532"
    read_only: true
    init: true
    environment:
      COVALENT_LISTEN: 127.0.0.1:8787
      COVALENT_PEER_LISTEN: 0.0.0.0:8787
      COVALENT_HTTPS_HOST: 127.0.0.1
      COVALENT_ADVERTISED_PEER_ADDRESS: 172.28.7.12:8787
      COVALENT_DATA_DIR: /data
      COVALENT_KEY_ENCRYPTION_KEY_FILE: /run/secrets/covalent-kek
      COVALENT_KEY_ENCRYPTION_KEY_VERSION: "1"
      COVALENT_DEVICE_NAME: Node B
      COVALENT_LAN_DISCOVERY: "false"
      UMASK: "027"
    ports: ["18782:8443/tcp", "18782:8787/udp"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - b-data:/data
      - b-config:/config
      - b-restore:/restore
      - type: bind
        source: ${COVALENT_E2E_KEK_B:?Set a distinct node B E2E KEK}
        target: /run/secrets/covalent-kek
        read_only: true
      - type: bind
        source: ${COVALENT_E2E_TOKEN_B:?Set a distinct node B E2E API token file}
        target: /run/secrets/covalent-api-token
        read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      peers:
        ipv4_address: 172.28.7.12
  node-c:
    image: ${COVALENT_IMAGE:-covalent:e2e}
    command: ["serve", "--api-token-file", "/run/secrets/covalent-api-token"]
    user: "65532:65532"
    read_only: true
    init: true
    environment:
      COVALENT_LISTEN: 127.0.0.1:8787
      COVALENT_PEER_LISTEN: 0.0.0.0:8787
      COVALENT_HTTPS_HOST: 127.0.0.1
      COVALENT_ADVERTISED_PEER_ADDRESS: 172.28.7.13:8787
      COVALENT_DATA_DIR: /data
      COVALENT_KEY_ENCRYPTION_KEY_FILE: /run/secrets/covalent-kek
      COVALENT_KEY_ENCRYPTION_KEY_VERSION: "1"
      COVALENT_DEVICE_NAME: Node C
      COVALENT_LAN_DISCOVERY: "false"
      UMASK: "027"
    ports: ["18783:8443/tcp", "18783:8787/udp"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    volumes:
      - c-data:/data
      - c-config:/config
      - c-restore:/restore
      - type: bind
        source: ${COVALENT_E2E_KEK_C:?Set a distinct node C E2E KEK}
        target: /run/secrets/covalent-kek
        read_only: true
      - type: bind
        source: ${COVALENT_E2E_TOKEN_C:?Set a distinct node C E2E API token file}
        target: /run/secrets/covalent-api-token
        read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    networks:
      peers:
        ipv4_address: 172.28.7.13

# A /24 rather than the /16 Docker hands out by default, so this stack claims
# the smallest range it can and is least likely to collide with a network the
# developer or runner already has.
networks:
  peers:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.7.0/24

volumes:
  a-data: {}
  a-config: {}
  b-data: {}
  b-config: {}
  c-data: {}
  c-config: {}
  a-restore: {}
  b-restore: {}
  c-restore: {}
