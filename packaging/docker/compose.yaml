name: covalent
services:
  node:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile
    image: covalent:local
    # Docker Compose file secrets are bind-mounted by the local implementation,
    # so their host ownership cannot safely follow an arbitrary PUID/PGID.
    # Keep the runtime identity fixed to the same UID that owns the 0400 secret.
    user: "65532:65532"
    read_only: true
    init: true
    restart: unless-stopped
    environment:
      UMASK: "${UMASK:-027}"
      COVALENT_DEVICE_NAME: "${COVALENT_DEVICE_NAME:-Covalent node}"
      COVALENT_LAN_DISCOVERY: "${COVALENT_LAN_DISCOVERY:-false}"
      COVALENT_LISTEN: "127.0.0.1:8787"
      COVALENT_PEER_LISTEN: "0.0.0.0:8787"
      COVALENT_HTTPS_HOST: "${COVALENT_HTTPS_HOST:-localhost}"
      COVALENT_ADVERTISED_PEER_ADDRESS: "${COVALENT_ADVERTISED_PEER_ADDRESS:-}"
      COVALENT_DATA_DIR: /data
      COVALENT_CONFIG_DIR: /config
      COVALENT_KEY_ENCRYPTION_KEY_FILE: /run/secrets/covalent-kek
      COVALENT_KEY_ENCRYPTION_KEY_VERSION: "${COVALENT_KEY_ENCRYPTION_KEY_VERSION:-1}"
    ports:
      - "${COVALENT_HTTPS_BIND_IP:-127.0.0.1}:${COVALENT_HTTPS_PORT:-8443}:8443/tcp"
      - "${COVALENT_PEER_BIND_IP:-0.0.0.0}:${COVALENT_PEER_PORT:-8787}:8787/udp"
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      # Keep the two durable paths explicit so operators know exactly what to
      # back up and can migrate them without hunting through Docker volumes.
      - type: bind
        source: "${COVALENT_CONFIG_HOST_DIR:-/srv/covalent/config}"
        target: /config
      - type: bind
        source: "${COVALENT_DATA_HOST_DIR:-/srv/covalent/data}"
        target: /data
      - type: bind
        source: "${COVALENT_BACKUP_SOURCE:-./example/source}"
        target: /source
        read_only: true
      - type: bind
        source: "${COVALENT_RESTORE_TARGET:-./example/restore}"
        target: /restore
        read_only: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    secrets:
      - source: covalent-kek
        target: covalent-kek
        uid: "65532"
        gid: "65532"
        mode: 0400

secrets:
  covalent-kek:
    file: "${COVALENT_KEK_FILE:?Set COVALENT_KEK_FILE to a separate owner-only KEK file}"
